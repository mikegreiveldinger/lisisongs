<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perlentaucher</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: full-screen canvas dive scene; HTML layers float on top (HUD, task plate, dive log menu, cards). Deliberately single-theme: deep sea at night-blue. */
:root{
  --abyss:#04203a; --deep:#0a3d63; --lagoon:#3fc6d8; --foam:#eefcff; --pearl:#fff3df;
  --sun:#ffd23f; --coral:#ff6f61; --kelp:#3fae6a; --mist:rgba(238,252,255,.72);
  --glass:rgba(4,32,58,.55); --glass-hi:rgba(238,252,255,.16);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--abyss);color:var(--foam);font-family:var(--body);font-size:16px;overflow:hidden;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.game{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.credit{flex:none;text-align:center;padding-block:4px 6px;font-family:var(--display);font-weight:500;font-size:.85rem;color:var(--mist);background:var(--abyss);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.credit a{color:var(--sun);text-decoration:none;font-weight:700}

/* HUD */
.hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:calc(max(16px,env(safe-area-inset-right,0px)) + 58px);pointer-events:none}
.hud>*{pointer-events:auto}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:inset 0 0 0 1.5px var(--glass-hi);flex:none}
.round svg{width:22px;height:22px}
.brandmark{position:absolute;z-index:5;top:8px;right:max(16px,env(safe-area-inset-right,0px));width:48px;height:48px;border-radius:50%;
  box-shadow:0 0 0 2px rgba(255,210,63,.9),0 4px 14px rgba(0,0,0,.35);pointer-events:none}
.ctl{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:12px;display:flex;gap:12px;z-index:2}
.ctl button{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:inset 0 0 0 2px var(--glass-hi),0 4px 12px rgba(0,0,0,.25);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ctl button:active,.ctl button.hit{background:rgba(255,210,63,.55)}
.ctl svg{width:30px;height:30px}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.game{-webkit-touch-callout:none}
.round .slash{display:none}.round.off{opacity:.6}.round.off .slash{display:inline}
.where{min-width:0;display:flex;flex-direction:column;line-height:1.1;text-shadow:0 1px 3px rgba(2,16,30,.7)}
.spacer{flex:1}
.hud{z-index:4}
.where b.pname{font-size:1.35rem;max-width:40vw}
.where b{font-family:var(--display);font-weight:700;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8rem;color:var(--foam);opacity:.85;font-variant-numeric:tabular-nums}
.purse{display:flex;align-items:center;gap:6px;background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:5px 12px 5px 6px;
  font-family:var(--display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1.5px var(--glass-hi);flex:none}
.pearl{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,#fdeed8 30%,#e8c9a4 70%,#c9a27c 100%);box-shadow:0 0 8px rgba(255,243,223,.6);flex:none}
.task{position:absolute;left:50%;top:62px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;max-width:calc(100% - 32px)}
.plate{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,9vw,3.4rem);line-height:1;padding:8px 22px 10px;border-radius:22px;
  background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:inset 0 0 0 2px var(--glass-hi),0 8px 24px rgba(0,0,0,.25);
  font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.02em}
.plate .q{color:var(--sun)}
.dots-row{display:flex;gap:5px;padding:5px 8px;border-radius:999px;background:var(--glass)}
.dots-row i{width:11px;height:11px;border-radius:50%;background:rgba(238,252,255,.22);display:block}
.dots-row i.ok{background:var(--pearl);box-shadow:0 0 6px var(--pearl)}
.dots-row i.miss{background:var(--coral)}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:10px 18px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:1.1rem;box-shadow:inset 0 0 0 1.5px var(--glass-hi);
  transition:opacity .3s, transform .3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.off{opacity:0;transform:translate(-50%,10px)}

/* overlays */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;
  padding-block:64px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.overlay.dim{background:rgba(2,16,30,.45)}
.panel{width:100%;max-width:460px;background:rgba(4,32,58,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:28px;
  box-shadow:inset 0 0 0 1.5px var(--glass-hi),0 20px 50px rgba(0,0,0,.35);padding:22px 20px;display:flex;flex-direction:column;gap:14px;margin:auto}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(2.4rem,11vw,3.4rem);line-height:.95;margin:0;letter-spacing:.01em;
  background:linear-gradient(180deg,#fff 0%,var(--pearl) 45%,var(--sun) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:0;color:var(--mist);max-width:32ch;line-height:1.4}
.log{display:flex;flex-direction:column;gap:0;position:relative}
.log:before{content:"";position:absolute;left:27px;top:24px;bottom:24px;width:3px;border-radius:3px;
  background:linear-gradient(180deg,var(--lagoon),#0b3a66 70%,#0c1a3a)}
.dive{position:relative;display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:12px;padding:8px 10px 8px 0;border-radius:16px;text-align:left}
.dive:not(:disabled):hover{background:rgba(238,252,255,.07)}
.dive:disabled{cursor:default;opacity:.45}
.dive .lock{width:20px;height:20px;opacity:.8}
.dive.treasure .gauge span{background:linear-gradient(180deg,#ffd75a,#c98d12);color:var(--abyss);box-shadow:none}
.dive.treasure:not(:disabled) .gauge span{box-shadow:0 0 14px rgba(255,210,63,.7)}
.dive .chesticon{width:30px;height:24px}
.gauge{width:58px;display:flex;justify-content:center}
.gauge span{font-family:var(--display);font-weight:600;font-size:.82rem;font-variant-numeric:tabular-nums;background:var(--deep);border-radius:999px;padding:3px 8px;
  box-shadow:inset 0 0 0 1.5px var(--glass-hi);white-space:nowrap}
.dive.cur .gauge span{background:var(--sun);color:var(--abyss);box-shadow:0 0 12px rgba(255,210,63,.6)}
.dive b{font-family:var(--display);font-weight:600;font-size:1.15rem;display:block;line-height:1.1}
.dive small{color:var(--mist);font-size:.85rem}
.stars{display:flex;gap:2px}
.stars svg{width:18px;height:18px}
.btn{font-family:var(--display);font-weight:700;font-size:1.25rem;background:var(--sun);color:var(--abyss);border-radius:18px;padding:12px 22px;
  box-shadow:0 5px 0 #c99a10;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c99a10}
.btn.alt{background:rgba(238,252,255,.14);color:var(--foam);box-shadow:inset 0 0 0 1.5px var(--glass-hi)}
.btn.sm{font-size:1rem;padding:9px 14px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card{align-items:center;text-align:center}
.card h2{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1.05;margin:0;text-wrap:balance}
.card p{margin:0;line-height:1.45;color:var(--mist);max-width:34ch}
.bigstars{display:flex;gap:8px}.bigstars svg{width:48px;height:48px}
.hintsum{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.hintsum .q{color:var(--sun)}
.tens{display:grid;grid-template-columns:repeat(10,18px);gap:6px;justify-content:center}
.tens span{width:18px;height:18px;border-radius:50%;background:var(--lagoon)}
.tens span:nth-child(10n+5){margin-right:8px}
.tens span.b{background:var(--coral)}
.tens span.o{background:transparent;box-shadow:inset 0 0 0 2px var(--mist)}
.tens span.x{background:transparent;box-shadow:inset 0 0 0 2px var(--mist);position:relative}
.tens span.x:after{content:"";position:absolute;left:-2px;right:-2px;top:8px;height:2px;background:var(--coral);transform:rotate(-40deg)}
.settings{display:flex;flex-direction:column;gap:8px;width:100%}
.settings .btn{width:100%}
.field{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left}
.field label{font-weight:700;font-size:.9rem}
.field input{font:inherit;font-size:1.15rem;padding:10px 12px;border-radius:12px;border:0;box-shadow:inset 0 0 0 2px var(--glass-hi);background:rgba(238,252,255,.08);color:var(--foam)}
.note{font-size:.82rem;color:var(--mist)}
.panel.wide{max-width:660px}
.goal{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:rgba(238,252,255,.06);border-radius:18px;padding:10px 14px;box-shadow:inset 0 0 0 1.5px var(--glass-hi)}
.goal svg{width:112px;height:56px;flex:none}
.goal p{margin:0;line-height:1.4;color:var(--foam);max-width:none}
.howto{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.dev{border-radius:18px;padding:12px 14px;background:rgba(238,252,255,.06);box-shadow:inset 0 0 0 1.5px var(--glass-hi);text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0}
.dev.mine{box-shadow:inset 0 0 0 2.5px var(--sun);background:rgba(255,210,63,.08)}
.dev h3{font-family:var(--display);font-weight:700;font-size:1.2rem;margin:0;display:flex;align-items:center;gap:8px}
.dev h3 svg{width:28px;height:28px;flex:none}
.badge{font-size:.72rem;background:var(--sun);color:var(--abyss);border-radius:999px;padding:2px 9px;font-family:var(--display);font-weight:700;margin-left:auto;white-space:nowrap}
.dev ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.dev li{display:flex;gap:10px;align-items:center;line-height:1.3;font-size:.95rem}
.ico{flex:none;min-width:44px;padding:0 6px;height:40px;border-radius:12px;display:flex;gap:3px;align-items:center;justify-content:center;background:rgba(238,252,255,.1)}
.ico svg{width:24px;height:24px}
.ico .mini{width:18px;height:18px;border-radius:50%;background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--glass-hi);display:grid;place-items:center}
.ico .mini svg{width:12px;height:12px}
kbd{font-family:var(--display);font-weight:600;min-width:24px;padding:1px 6px;border-radius:7px;background:var(--foam);color:var(--abyss);box-shadow:0 3px 0 #9fb7c4;display:inline-block;text-align:center;font-size:.85rem;line-height:1.4}
.overlay.top{align-items:flex-start;pointer-events:none;background:none}
.overlay.top .panel{pointer-events:auto;max-width:540px;padding:16px 18px;gap:10px;margin:0 auto}
.overlay.top h2{font-size:1.6rem}
@media (max-width:560px){.panel.wide{padding:16px 14px;gap:10px}.panel.wide h2{font-size:1.6rem}.goal{flex-direction:column;gap:4px;text-align:center}.goal p,.dev li{font-size:.92rem}.overlay.top h2{font-size:1.3rem}.overlay.top p{font-size:.95rem}.overlay.top .btn{font-size:1.05rem;padding:10px 16px}.dev:not(.mine){display:none}.howto{grid-template-columns:1fr}.goal svg{width:90px;height:45px}}
@media (max-width:420px){.toast{font-size:.95rem;bottom:86px;padding:8px 14px}.hud{gap:6px}.round{width:38px;height:38px}.purse{font-size:1rem;padding:4px 10px 4px 5px}}
@media (max-width:380px){.dive{grid-template-columns:52px 1fr auto;gap:8px}.log:before{left:24px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>

<div class="game" id="game">
  <canvas id="cv" aria-label="Unterwasser-Szene mit U-Boot und Antwort-Blasen"></canvas>

  <div class="hud" id="hud" hidden>
    <button class="round" id="back" aria-label="Zum Tauchplan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="where"><b class="pname" id="pName">Taucherin</b><span id="lvName">Tauchplan</span></div>
    <div class="purse" aria-label="Punkte"><i class="pearl" id="purseIcon"></i><span id="pearls">0</span></div>
    <span class="spacer"></span>
    <button class="round" id="mus" aria-label="Musik ausschalten"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 17.5V6.2l10-2.2v11.3"/><circle cx="6.5" cy="17.5" r="2.8"/><circle cx="16.5" cy="15.3" r="2.8"/><path d="M9 6.2l10-2.2v3L9 9.2z"/><path class="slash" d="M3 3l18 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    <button class="round" id="speak" aria-label="Aufgabe vorlesen"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
  </div>
  <div class="task" id="task" hidden>
    <div class="plate" id="plate">3 + 4 = <span class="q">?</span></div>
    <div class="dots-row" id="prog"></div>

const P=(a,op,b)=>({a,op,b,ans:op==='+'?a+b:a-b,kind:'std'});
function add10(){const a=rnd(1,9),b=rnd(1,10-a);return P(a,'+',b);}
function sub10(){const a=rnd(2,10),b=rnd(1,a-1);return P(a,'−',b);}
function add20(){if(Math.random()<.6){const a=rnd(4,9),b=rnd(11-a,9);return Math.random()<.5?P(a,'+',b):P(b,'+',a);}const a=rnd(10,17),b=rnd(1,20-a);return P(a,'+',b);}
function sub20(){if(Math.random()<.6){const a=rnd(11,18),b=rnd(a-9,9);return P(a,'−',b);}const a=rnd(12,20),b=rnd(1,a-10);return P(a,'−',b);}
function gap(){if(Math.random()<.5){const c=rnd(8,20),a=rnd(2,c-1);return {a,op:'+',b:c,ans:c-a,kind:'gapAdd'};}
  const c=rnd(8,20),d=rnd(1,c-1);return {a:c,op:'−',b:d,ans:c-d,kind:'gapSub'};}
const mix=(...g)=>()=>pick(g)();
function taskText(q,withAns){
  const A=withAns?`<span class="q">${q.ans}</span>`:'<span class="q">?</span>';
  if(q.kind==='gapAdd')return `${q.a} + ${A} = ${q.b}`;
  if(q.kind==='gapSub')return `${q.a} − ${A} = ${q.b}`;
  return `${q.a} ${q.op} ${q.b} = ${A}`;
}
function taskSpeech(q){
  const w=q.op==='+'?'plus':'minus';
  if(q.kind==='gapAdd')return `${q.a} plus wie viel ist ${q.b}?`;
  if(q.kind==='gapSub')return `${q.a} minus wie viel ist ${q.b}?`;
  return `${q.a} ${w} ${q.b}`;
}

const M={nodes:null,timer:0,next:0,step:0,theme:MT.bright,want:MT.bright};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function musicNodes(a){
  if(M.nodes)return M.nodes;
  const master=a.createGain();master.gain.value=0;master.connect(a.destination);
  const len=Math.floor(a.sampleRate*2.8),buf=a.createBuffer(2,len,a.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
  const conv=a.createConvolver();conv.buffer=buf;const wet=a.createGain();wet.gain.value=.6;conv.connect(wet).connect(master);
  const bus=a.createBiquadFilter();bus.type='lowpass';bus.frequency.value=2600;bus.connect(master);bus.connect(conv);
  M.nodes={master,bus,a};return M.nodes;
}
function tone2(t,midi,dur,type,vol,att,detune){
  const a=ac,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=mtof(midi);if(detune)o.detune.value=detune;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(M.nodes.bus);o.start(t);o.stop(t+dur+.05);
}
function schedule(){
  const a=ac;if(!a||!M.nodes)return;
  while(M.next<a.currentTime+.3){
    const th=M.theme,e=60/th.bpm/2,s=M.step%32,bar=Math.floor(s/8),pos=s%8,t=M.next,ch=th.chords[bar];
    if(pos===0)ch.forEach(m=>{tone2(t,m,e*9,'triangle',.022,.9,-6);tone2(t,m+12,e*9,'sine',.012,1.1,6);});
    if(pos===0||pos===4)tone2(t,th.bass[bar],e*3.6,'sine',.075,.03);
    const pat=[0,1,2,1,3,2,1,2],k=pat[pos],m=(k===3?ch[0]+12:ch[k])+th.lift;
    if(Math.random()<th.density){tone2(t,m,e*2.2,'sine',.05,.006);tone2(t,m+12,e*1.2,'triangle',.012,.004);}
    if(Math.random()<.03){const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(700,t);o.frequency.exponentialRampToValueAtTime(1700,t+.12);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.03,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(g).connect(M.nodes.bus);o.start(t);o.stop(t+.2);}
    M.next+=e;M.step++;
    if(M.step%32===0&&M.want!==M.theme)M.theme=M.want;
  }
}
function startMusic(){
  if(!S.music)return;const a=audio();if(!a)return;musicNodes(a);
  if(!M.timer){M.theme=M.want;M.next=a.currentTime+.15;M.step=0;M.timer=setInterval(schedule,90);}
  const g=M.nodes.master.gain;g.cancelScheduledValues(a.currentTime);g.setValueAtTime(g.value,a.currentTime);g.linearRampToValueAtTime(.55,a.currentTime+1.5);
  musicBtn();
}
function stopMusic(){
  if(!ac||!M.nodes){musicBtn();return;}const g=M.nodes.master.gain,t=ac.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(0,t+.5);
  const tm=M.timer;M.timer=0;setTimeout(()=>clearInterval(tm),600);musicBtn();
}

const G={mode:'menu',lv:0,list:[],idx:0,res:[],tries:0,mistakes:0,wave:null,pause:false,speed:0};

function options(q){
  const c=q.ans,set=new Set([c]),cands=shuffle([c+1,c-1,c+2,c-2,c+10,c-10,q.kind==='std'?(q.op==='+'?q.a-q.b:q.a+q.b):c+3]);
  for(const v of cands){if(set.size>=3)break;if(v>=0&&v<=20&&!set.has(v))set.add(v);}

function updateFinale(dt){

function drawTentacle(pts,r0,r1,col,sucker){
  for(let i=0;i<pts.length;i++){const t=i/(pts.length-1),r=lerp(r0,r1,t);ctx.fillStyle=col;ctx.beginPath();ctx.arc(pts[i][0],pts[i][1],r,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle=sucker;for(let i=3;i<pts.length-2;i+=3){const t=i/(pts.length-1);ctx.beginPath();ctx.arc(pts[i][0],pts[i][1]+lerp(r0,r1,t)*.35,lerp(r0,r1,t)*.38,0,Math.PI*2);ctx.fill();}
}
function drawOcto(x,y,s,carry,toChestY){
  const bob=Math.sin(T*1.6)*s*.06;y+=bob;const N=26,baseY=y+s*.55;
  // Tentakel
  for(let i=0;i<6;i++){
    const bx=x+lerp(-s*.72,s*.72,i/5),pts=[];
    const waving=!carry&&i===5,len=carry?Math.max(s*.6,toChestY-baseY+s*.15):s*1.5;
    for(let k=0;k<N;k++){const t=k/(N-1);let px,py;
      if(waving){const a=-.3-t*1.6+Math.sin(T*4)*.35*t;px=bx+Math.cos(a)*t*s*1.4+s*.1*t;py=baseY+Math.sin(a)*t*s*1.4;}
      else{const sway=Math.sin(T*2.4+i*1.3+t*3)*s*.14*t;const spread=(i-2.5)*s*(carry?.06:.22)*t;px=bx+sway+spread;py=baseY+t*len;
        if(!carry&&t>.75){const c=(t-.75)/.25;px+=Math.sin(c*Math.PI*1.2)*s*.22*(i<3?-1:1);py-=c*c*s*.18;}}
      pts.push([px,py]);}
    drawTentacle(pts,s*.2,s*.06,i%2?'#9466f0':'#a77bff','rgba(255,214,240,.55)');
  }
  // Kopf
  const hg=ctx.createRadialGradient(x-s*.35,y-s*.75,s*.1,x,y-s*.2,s*1.25);hg.addColorStop(0,'#e3cbff');hg.addColorStop(.45,'#ad84ff');hg.addColorStop(1,'#7347d6');
  ctx.fillStyle=hg;ctx.beginPath();ctx.ellipse(x,y-s*.25,s*1.02,s*1.08,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.18)';[[-.5,-.8,.12],[.45,-.95,.09],[.62,-.45,.07],[-.2,-1.05,.06]].forEach(([a,b,r])=>{ctx.beginPath();ctx.arc(x+a*s,y+b*s,r*s,0,Math.PI*2);ctx.fill();});
  // Augen
  const blink=(T%4.2)<.14;
  [-1,1].forEach(d=>{const ex=x+d*s*.38,ey=y-s*.18;
    if(blink){ctx.strokeStyle='#2a1550';ctx.lineWidth=s*.05;ctx.lineCap='round';ctx.beginPath();ctx.arc(ex,ey,s*.2,.2,Math.PI-.2);ctx.stroke();return;}
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(ex,ey,s*.25,s*.29,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1d1235';ctx.beginPath();ctx.arc(ex-s*.06,ey+s*.03,s*.15,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex-s*.11,ey-s*.04,s*.055,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ex-s*.01,ey+s*.08,s*.025,0,Math.PI*2);ctx.fill();});
  ctx.fillStyle='rgba(255,120,170,.55)';[-1,1].forEach(d=>{ctx.beginPath();ctx.ellipse(x+d*s*.66,y+s*.12,s*.14,s*.08,0,0,Math.PI*2);ctx.fill();});
  ctx.strokeStyle='#3a1d6e';ctx.lineWidth=s*.06;ctx.lineCap='round';ctx.beginPath();ctx.arc(x,y+s*.12,s*.2,.25,Math.PI-.25);ctx.stroke();
}
function drawChest(x,y,w,open){

  // Schatten
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,y+4,w*.62,w*.07,0,0,Math.PI*2);ctx.fill();

    ctx.fillStyle=gl;ctx.beginPath();ctx.moveTo(L+w*.08,top);ctx.lineTo(L-w*.5,top-H);ctx.lineTo(L+w*1.5,top-H);ctx.lineTo(L+w*.92,top);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.arc(x,top,w*1.4,0,Math.PI*2);ctx.fill();ctx.restore();}

  const gold=(gx,gy,gw,gh)=>{const gg=ctx.createLinearGradient(gx,0,gx+gw,0);gg.addColorStop(0,'#c98d12');gg.addColorStop(.5,'#ffd75a');gg.addColorStop(1,'#c98d12');ctx.fillStyle=gg;ctx.fillRect(gx,gy,gw,gh);};
  gold(L+w*.1,top,w*.07,h);gold(L+w*.83,top,w*.07,h);gold(L,y-h*.12,w,h*.12);
  gold(x-w*.07,top+h*.08,w*.14,h*.32);ctx.fillStyle='#4a2a0c';ctx.beginPath();ctx.arc(x,top+h*.2,w*.022,0,Math.PI*2);ctx.fill();ctx.fillRect(x-w*.008,top+h*.2,w*.016,h*.11);
  // Deckel (Scharnier hinten links)

  const lw=ctx.createLinearGradient(0,-lidH,0,0);lw.addColorStop(0,'#b97234');lw.addColorStop(1,'#7f4519');ctx.fillStyle=lw;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-lidH*.5);ctx.quadraticCurveTo(0,-lidH,w*.18,-lidH);ctx.lineTo(w*.82,-lidH);ctx.quadraticCurveTo(w,-lidH,w,-lidH*.5);ctx.lineTo(w,0);ctx.closePath();ctx.fill();
  const g2=(gx)=>{const gg=ctx.createLinearGradient(gx,0,gx+w*.07,0);gg.addColorStop(0,'#c98d12');gg.addColorStop(.5,'#ffd75a');gg.addColorStop(1,'#c98d12');ctx.fillStyle=gg;ctx.fillRect(gx,-lidH*.97,w*.07,lidH*.97);};
  g2(w*.1);g2(w*.83);
  if(open<.05){ctx.fillStyle='#ffd75a';ctx.fillRect(w*.45,-lidH*.25,w*.1,lidH*.4);}
  ctx.restore();
  // Funkeln
  if(open<1){ctx.save();ctx.globalCompositeOperation='lighter';for(let k=0;k<5;k++){const a=T*1.3+k*1.26,tw=.5+.5*Math.sin(T*4+k*2);star5(x+Math.cos(a)*w*.7,top+Math.sin(a)*w*.35,w*.03*tw+2,`rgba(255,230,140,${.8*tw})`);}ctx.restore();}
}
function drawPearlT(x,y,r,tint){const g=ctx.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);g.addColorStop(0,'#ffffff');g.addColorStop(.45,tint);g.addColorStop(1,mixHex(tint==='#ffffff'?'#e8e2d8':tint,'#7d6a5a',.35));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(x-r*.35,y-r*.38,r*.22,0,Math.PI*2);ctx.fill();}
function drawFinale(){

  ctx.fillStyle=hexA('#ffffff',.08);ctx.beginPath();ctx.ellipse(0,-34*s,44*s,22*s,0,Math.PI,0);ctx.fill();ctx.restore();}
function kelp(x,base,h,seed,col){
  ctx.strokeStyle=col;ctx.lineCap='round';ctx.lineWidth=6;const seg=12;let px=x,py=base;ctx.beginPath();ctx.moveTo(px,py);const pts=[];
  for(let k=1;k<=seg;k++){const t=k/seg;const nx=x+Math.sin(T*1.1+seed*3+t*2.4)*t*28,ny=base-h*t;ctx.lineTo(nx,ny);pts.push([nx,ny,t]);}
  ctx.stroke();ctx.fillStyle=col;
  pts.forEach(([px,py,t],k)=>{if(k%2)return;const side=k%4?1:-1;ctx.save();ctx.translate(px,py);ctx.rotate(side*.9+Math.sin(T*1.5+k)*.15);
    ctx.beginPath();ctx.ellipse(side*10,0,12,4.5,0,0,Math.PI*2);ctx.fill();ctx.restore();});
}
function rock(x,y,w,h,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x-w/2,y);ctx.bezierCurveTo(x-w/2,y-h*.8,x-w*.2,y-h,x,y-h);ctx.bezierCurveTo(x+w*.3,y-h,x+w/2,y-h*.6,x+w/2,y);ctx.closePath();ctx.fill();}
function wreck(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.rotate(-.12);ctx.fillStyle=mixHex(LV.bot,'#000000',.35);
  ctx.beginPath();ctx.moveTo(-160*s,0);ctx.lineTo(150*s,0);ctx.quadraticCurveTo(210*s,-10*s,230*s,-70*s);ctx.lineTo(-140*s,-70*s);ctx.quadraticCurveTo(-170*s,-40*s,-160*s,0);ctx.fill();
  ctx.fillRect(-90*s,-160*s,8*s,95*s);ctx.fillRect(40*s,-200*s,9*s,135*s);ctx.fillRect(10*s,-170*s,70*s,5*s);
  ctx.fillStyle=hexA(LV.top,.25);for(let k=0;k<5;k++){ctx.beginPath();ctx.arc(-100*s+k*55*s,-38*s,7*s,0,Math.PI*2);ctx.fill();}
  ctx.strokeStyle=hexA('#000000',.3);ctx.lineWidth=3*s;ctx.beginPath();ctx.moveTo(44*s,-195*s);ctx.lineTo(160*s,-70*s);ctx.stroke();
  ctx.restore();
}
function anglerLight(x,y){const rg=ctx.createRadialGradient(x,y,0,x,y,26);rg.addColorStop(0,'rgba(255,250,180,.9)');rg.addColorStop(.2,'rgba(255,240,140,.35)');rg.addColorStop(1,'rgba(255,240,140,0)');
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=rg;ctx.fillRect(x-26,y-26,52,52);ctx.restore();}

function drawMidground(){
  const d=LV.deco;
  if(d==='wreck')layer(.4,1500,31,(x,i)=>wreck(x+300,floorY+12,clamp(H/700,.55,1)));
  if(d==='trench'||d==='glow')layer(.45,420,41,(x,i)=>{rock(x,floorY+10,180+hash(i,2)*160,H*(.25+hash(i,4)*.25),mixHex(LV.bot,'#000000',.4));});
  // Seegras / Kelp
  const kc=mixHex(LV.top,'#2f8a4c',LV.depth<60?.75:.35);
  const kd=d==='kelp'?70:d==='coral'?240:d==='wreck'?260:420;
  layer(.6,kd,51,(x,i)=>kelp(x,floorY+6,H*(d==='kelp'?.32+hash(i,5)*.3:.12+hash(i,5)*.12),i,kc));
}
function drawFloor(){
  const sg=ctx.createLinearGradient(0,floorY-10,0,H);sg.addColorStop(0,LV.sand);sg.addColorStop(1,mixHex(LV.sand,'#000000',.45));
  ctx.fillStyle=sg;ctx.beginPath();ctx.moveTo(0,H);const off=world*.8;
  for(let x=0;x<=W+20;x+=20){const y=floorY+Math.sin((x+off)*.012)*6+Math.sin((x+off)*.031)*3;ctx.lineTo(x,y);}ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  // Rippeln
  ctx.strokeStyle=hexA('#000000',.08);ctx.lineWidth=2;layer(.8,46,61,(x,i)=>{const y=floorY+16+hash(i,6)*(H-floorY-24);ctx.beginPath();ctx.moveTo(x-14,y);ctx.quadraticCurveTo(x,y-5,x+14,y);ctx.stroke();});
  // Kaustik
  if(LV.rays>.1){ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle=`rgba(255,255,230,${LV.rays*.35})`;ctx.lineWidth=2;
    for(let k=0;k<14;k++){const cx=((k*97+T*12)%(W+80))-40,cy=floorY+10+(k%4)*((H-floorY)/4);ctx.beginPath();
      ctx.ellipse(cx,cy,18+Math.sin(T*1.7+k)*6,5+Math.cos(T*1.3+k)*2,0,0,Math.PI*2);ctx.stroke();}ctx.restore();}
  // Korallen, Muscheln, Seesterne
  const d=LV.deco;
  if(d==='coral'||d==='kelp'||d==='wreck'){
    const cols=d==='coral'?['#ff6f91','#ff9671','#c77dff','#ffc75f']:['#c77d9a','#d89a6a','#9a83c9'];
    layer(.85,150,71,(x,i)=>{const c=cols[((i%cols.length)+cols.length)%cols.length];const k=hash(i,7);if(k<.45)coral(x,floorY+8,.8+hash(i,8)*.6,c,i);else if(k<.7)fanCoral(x,floorY+8,.8+hash(i,8)*.5,c);
      else{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,floorY+4,22,14,0,Math.PI,0);ctx.fill();ctx.strokeStyle=hexA('#000000',.15);ctx.lineWidth=1.5;
        for(let r=1;r<4;r++){ctx.beginPath();ctx.ellipse(x,floorY+4,22-r*5,14-r*3.5,0,Math.PI,0);ctx.stroke();}}});
  }
  layer(.9,210,81,(x,i)=>{const y=floorY+18+hash(i,9)*(H-floorY-30);if(hash(i,10)<.5){star5(x,y,9,LV.glow>.5?'#ff7ae6':'#ff8a5c');}
    else{ctx.fillStyle=LV.glow>.5?'#c9b7ff':'#fff1e0';ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,9,Math.PI,0);ctx.closePath();ctx.fill();
      ctx.strokeStyle=hexA('#000000',.18);ctx.lineWidth=1;for(let r=-2;r<=2;r++){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+r*4,y-8+Math.abs(r));ctx.stroke();}}});
  if(LV.glow>.5)layer(.9,260,91,(x,i)=>{const y=floorY+6;ctx.fillStyle='#2a3550';ctx.fillRect(x-2,y-30,4,30);ctx.fillStyle='#59f8e8';
    const tw=.6+.4*Math.sin(T*2+i);ctx.save();ctx.globalAlpha=tw;ctx.beginPath();ctx.ellipse(x,y-32,12,7,0,Math.PI,0);ctx.fill();ctx.restore();anglerLight(x,y-34);});
}
function star5(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();ctx.fill();}
function drawFish(f){
  const s=f.s,w=Math.sin(T*10+f.ph)*.35;ctx.save();ctx.translate(f.x,f.y+Math.sin(T*2+f.ph)*4);
  ctx.fillStyle=f.c;ctx.beginPath();ctx.ellipse(0,0,s*1.4,s*.75,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(s*1.1,0);ctx.lineTo(s*2.1,-s*.7+w*s);ctx.lineTo(s*2.1,s*.7+w*s);ctx.closePath();ctx.fill();
  ctx.fillStyle=hexA('#ffffff',.25);ctx.beginPath();ctx.ellipse(-s*.1,-s*.25,s*.9,s*.22,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-s*.8,-s*.15,s*.26,0,Math.PI*2);ctx.fill();ctx.fillStyle='#10202c';ctx.beginPath();ctx.arc(-s*.85,-s*.15,s*.13,0,Math.PI*2);ctx.fill();
  if(LV.glow>.5){ctx.save();ctx.globalCompositeOperation='lighter';const rg=ctx.createRadialGradient(0,0,0,0,0,s*2.4);rg.addColorStop(0,hexA(f.c,.35));rg.addColorStop(1,hexA(f.c,0));ctx.fillStyle=rg;ctx.fillRect(-s*2.4,-s*2.4,s*4.8,s*4.8);ctx.restore();}
  ctx.restore();
}
function drawJelly(j){
  const p=Math.sin(T*2+j.ph),s=j.s;ctx.save();ctx.translate(j.x,j.y+p*6);
  ctx.globalCompositeOperation='lighter';const rg=ctx.createRadialGradient(0,0,0,0,0,s*2.6);rg.addColorStop(0,hexA(j.c,.35));rg.addColorStop(1,hexA(j.c,0));ctx.fillStyle=rg;ctx.fillRect(-s*2.6,-s*2.6,s*5.2,s*5.2);
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=hexA(j.c,.6);ctx.beginPath();ctx.ellipse(0,0,s*(1+p*.08),s*(.75-p*.06),0,Math.PI,0);ctx.quadraticCurveTo(0,s*.25,-s*(1+p*.08),0);ctx.fill();
  ctx.strokeStyle=hexA(j.c,.55);ctx.lineWidth=2;
  for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(k*s*.35,s*.1);for(let t=1;t<=6;t++)ctx.lineTo(k*s*.35+Math.sin(T*3+t+k)*4,s*.1+t*s*.32);ctx.stroke();}
  ctx.restore();
}
function drawSub(){
  const L=subLen,Hh=L*.42,x=subX+(sub.shake?Math.sin(T*60)*sub.shake*6:0),y=sub.y+Math.sin(T*1.6)*3,tilt=clamp(sub.vy*.0016,-.25,.25);
  // Scheinwerfer
  if(LV.glow>0){ctx.save();ctx.globalCompositeOperation='lighter';const lx=x+L*.5,ly=y+Hh*.05;
    const cg=ctx.createRadialGradient(lx,ly,0,lx,ly,L*3.2);cg.addColorStop(0,`rgba(255,250,210,${.32*LV.glow+.05})`);cg.addColorStop(1,'rgba(255,250,210,0)');
    ctx.fillStyle=cg;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx+L*3.2,ly-L*1.1);ctx.lineTo(lx+L*3.2,ly+L*1.1);ctx.closePath();ctx.fill();ctx.restore();}
  ctx.save();ctx.translate(x,y);ctx.rotate(tilt);
  // Propeller
  const pw=Math.abs(Math.sin(T*22))*Hh*.55+3;ctx.fillStyle='#7d8a96';ctx.fillRect(-L*.58,-3,L*.1,6);
  ctx.fillStyle='#c4ced6';ctx.beginPath();ctx.ellipse(-L*.6,0,4,pw,0,0,Math.PI*2);ctx.fill();
  // Turm
  const bg=ctx.createLinearGradient(0,-Hh,0,Hh*.6);bg.addColorStop(0,'#ffe066');bg.addColorStop(1,'#f4a100');
  ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(-L*.16,-Hh*.95,L*.32,Hh*.6,8);ctx.fill();
  ctx.strokeStyle='#8a96a3';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(L*.05,-Hh*.9);ctx.lineTo(L*.05,-Hh*1.3);ctx.lineTo(L*.16,-Hh*1.3);ctx.stroke();
  // Rumpf
  ctx.fillStyle=bg;ctx.beginPath();ctx.ellipse(0,0,L*.52,Hh*.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff6f61';ctx.beginPath();ctx.ellipse(-L*.05,Hh*.18,L*.46,Hh*.12,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(-L*.06,-Hh*.24,L*.32,Hh*.09,0,0,Math.PI*2);ctx.fill();
  // Flosse
  ctx.fillStyle='#ff6f61';ctx.beginPath();ctx.moveTo(-L*.42,-Hh*.1);ctx.lineTo(-L*.56,-Hh*.5);ctx.lineTo(-L*.5,-Hh*.05);ctx.closePath();ctx.fill();
  // Bullaugen
  const port=(px,r)=>{ctx.fillStyle='#8a96a3';ctx.beginPath();ctx.arc(px,-Hh*.02,r+3,0,Math.PI*2);ctx.fill();
    const gg=ctx.createRadialGradient(px-r*.3,-Hh*.02-r*.3,1,px,-Hh*.02,r);gg.addColorStop(0,'#c9f6ff');gg.addColorStop(1,'#2b7fae');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(px,-Hh*.02,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(px-r*.35,-Hh*.02-r*.35,r*.25,0,Math.PI*2);ctx.fill();};
  port(-L*.2,Hh*.15);port(L*.02,Hh*.15);
  // Cockpit mit Lisi
  const cx=L*.27,cy=-Hh*.12,cr=Hh*.36;
  ctx.fillStyle='#8a96a3';ctx.beginPath();ctx.arc(cx,cy,cr+Hh*.06,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,cr,0,Math.PI*2);ctx.clip();
  ctx.fillStyle='#3a8fc0';ctx.fillRect(cx-cr,cy-cr,cr*2,cr*2);
  if(faceImg.complete&&faceImg.naturalWidth){ctx.save();ctx.translate(cx,cy);ctx.rotate(-tilt*.6);ctx.drawImage(faceImg,-cr*1.12,-cr*1.12,cr*2.24,cr*2.24);ctx.restore();}
  const gl=ctx.createRadialGradient(cx-cr*.4,cy-cr*.5,1,cx,cy,cr);gl.addColorStop(0,'rgba(220,250,255,.35)');gl.addColorStop(.6,'rgba(120,200,240,.08)');gl.addColorStop(1,'rgba(40,120,180,.35)');
  ctx.fillStyle=gl;ctx.fillRect(cx-cr,cy-cr,cr*2,cr*2);ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.ellipse(cx-cr*.45,cy-cr*.5,cr*.28,cr*.12,-.6,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#6f7b88';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,cr,0,Math.PI*2);ctx.stroke();
  // Lampe
  ctx.fillStyle='#fff6c9';ctx.beginPath();ctx.arc(L*.51,Hh*.05,3.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawBubble(b){
  const r=R*(b.state==='caught'?1+b.t*1.5:1),wob=Math.sin(T*3+b.ph)*R*.04,x=b.x,y=b.y+Math.sin(T*1.8+b.ph)*4;
  let a=1;if(b.state==='fade')a=Math.max(0,1-b.t*2);if(b.state==='caught')a=Math.max(0,1-b.t*3);if(b.state==='wrong')a=Math.max(0,1-b.t*1.4);
  if(a<=0)return;ctx.save();ctx.globalAlpha=a;
  const near=G.mode==='play'&&b.state==='live'&&b.lane===sub.lane;
  if(near){ctx.save();ctx.globalCompositeOperation='lighter';const hg=ctx.createRadialGradient(x,y,r*.8,x,y,r*1.5);hg.addColorStop(0,'rgba(255,210,63,.35)');hg.addColorStop(1,'rgba(255,210,63,0)');ctx.fillStyle=hg;ctx.beginPath();ctx.arc(x,y,r*1.5,0,Math.PI*2);ctx.fill();ctx.restore();}
  const wrong=b.state==='wrong';
  const g=ctx.createRadialGradient(x-r*.3,y-r*.35,r*.1,x,y,r);g.addColorStop(0,wrong?'rgba(255,140,120,.35)':'rgba(255,255,255,.22)');g.addColorStop(.75,wrong?'rgba(255,111,97,.35)':'rgba(170,235,255,.22)');g.addColorStop(1,wrong?'rgba(255,111,97,.7)':'rgba(200,245,255,.55)');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,r+wob,r-wob,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=wrong?'rgba(255,160,150,.95)':'rgba(255,255,255,.85)';ctx.lineWidth=2.5;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.ellipse(x-r*.42,y-r*.45,r*.2,r*.11,-.7,0,Math.PI*2);ctx.fill();
  ctx.font=`700 ${Math.round(r*1.05)}px Fredoka, "Trebuchet MS", sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=5;ctx.strokeStyle='rgba(4,32,58,.55)';ctx.strokeText(b.v,x,y+r*.04);ctx.fillStyle=near?'#ffe27a':'#ffffff';ctx.fillText(b.v,x,y+r*.04);
  ctx.restore();
}
function drawPearl(x,y,r){const g=ctx.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);g.addColorStop(0,'#ffffff');g.addColorStop(.4,'#fdeed8');g.addColorStop(1,'#c9a27c');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}

/* ---------- Schleife ---------- */
let last=performance.now(),schoolT=1,jellyT=3,trailT=0;
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;if(reduced)dt*=.6;T+=dt;
  const playing=G.mode==='play'&&!G.pause;
  world+=dt*(playing?60:G.mode==='finale'?8:28);
  if(G.mode==='finale')updateFinale(dt);
  // U-Boot
  const ty=G.mode==='play'?lanes[sub.lane]:G.mode==='finale'?floorY-subLen*.36:lanes[1]+Math.sin(T*.7)*R*.6;const prev=sub.y;
  sub.y+= (ty-sub.y)*Math.min(1,dt*7);sub.vy=(sub.y-prev)/Math.max(dt,.001);sub.shake=Math.max(0,sub.shake-dt*2);
  // Blasen
  const w=G.wave;
  if(w){w.bubbles.forEach(b=>{if(b.state==='live'){if(playing)b.x-=G.speed*dt;}else b.t+=dt;b.y=lanes[b.lane];});
    if(!w.done&&playing){const front=w.bubbles[0];if(front.x-R<=subX+subLen*.5){let best=null,d=1e9;w.bubbles.forEach(b=>{const dd=Math.abs(b.y-sub.y);if(dd<d){d=dd;best=b;}});catchBubble(best);}}}
  // Fische, Quallen
  schoolT-=dt;if(schoolT<=0){spawnSchool();schoolT=rnd(4,8);}
  if(LV.glow>.1||LV.deco==='kelp'){jellyT-=dt;if(jellyT<=0){spawnJelly();jellyT=rnd(6,11);}}
  fish.forEach(f=>f.x-=(f.v+(playing?30:12))*dt);for(let i=fish.length-1;i>=0;i--)if(fish[i].x<-60)fish.splice(i,1);
  jellies.forEach(j=>{j.x-=(playing?40:18)*dt;j.y-=Math.max(0,Math.sin(T*2+j.ph))*8*dt;});for(let i=jellies.length-1;i>=0;i--)if(jellies[i].x<-80)jellies.splice(i,1);
  snow.forEach(p=>{p.y+=p.v*dt*.4;p.x-=(playing?24:10)*dt*p.s;if(p.y>H)p.y=0;if(p.x<0)p.x=W;});
  trailT-=dt;if(trailT<=0){trailT=.08;trail.push({x:subX-subLen*.62,y:sub.y+(Math.random()-.5)*8,r:Math.random()*3+1.5,life:1});}
  trail.forEach(b=>{b.x-=(playing?70:35)*dt;b.y-=22*dt;b.life-=dt*.7;});for(let i=trail.length-1;i>=0;i--)if(trail[i].life<=0)trail.splice(i,1);
  fx.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy=p.vy*.96-30*dt;p.life-=dt*1.4;});for(let i=fx.length-1;i>=0;i--)if(fx[i].life<=0)fx.splice(i,1);
  flyers.forEach(f=>f.t+=dt*1.4);for(let i=flyers.length-1;i>=0;i--)if(flyers[i].t>=1){flyers.splice(i,1);$('#pearls').textContent=S.pearls;}

  // Zeichnen
  drawBackground();drawGlowSpecks();
  ctx.fillStyle='rgba(255,255,255,.5)';snow.forEach(p=>{ctx.globalAlpha=.25+p.s*.2;ctx.fillRect(p.x,p.y,p.s,p.s);});ctx.globalAlpha=1;
  fish.filter(f=>f.s<9).forEach(drawFish);
  drawMidground();jellies.forEach(drawJelly);drawFloor();
  fish.filter(f=>f.s>=9).forEach(drawFish);
  trail.forEach(b=>{ctx.strokeStyle=`rgba(255,255,255,${b.life*.6})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();});
  if(G.mode==='play'){ctx.save();ctx.setLineDash([2,12]);ctx.lineCap='round';ctx.lineWidth=3;
    lanes.forEach((ly,i)=>{ctx.strokeStyle=i===sub.lane?'rgba(255,210,63,.35)':'rgba(255,255,255,.12)';ctx.beginPath();ctx.moveTo(subX+subLen*.6,ly);ctx.lineTo(W,ly);ctx.stroke();});ctx.restore();}
  if(w)w.bubbles.forEach(drawBubble);
  drawSub();
  if(G.mode==='finale')drawFinale();
  fx.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.strokeStyle=p.c;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();});ctx.globalAlpha=1;
  flyers.forEach(f=>{const e=1-Math.pow(1-f.t,3);const x=lerp(f.sx,f.tx,e),y=lerp(f.sy,f.ty,e)-Math.sin(e*Math.PI)*80;drawPearl(x,y,lerp(14,10,e));});
  // Vignette
  const vg=ctx.createRadialGradient(W/2,H*.45,Math.min(W,H)*.35,W/2,H*.5,Math.max(W,H)*.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,`rgba(1,10,24,${.25+LV.glow*.25})`);ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  requestAnimationFrame(frame);
}

/* ---------- Start ---------- */
function start(data){
  load();if(data&&data.save)S=Object.assign(fresh(),data.save);
  window.claude?.hot?.snapshot?.(()=>({save:S}));
  S.finished=allDone();save();new ResizeObserver(resize).observe(game);resize();seedScene();showMenu();musicBtn();if(!S.name)showNameScreen();else if(!S.seenIntro)showIntroScreen();
  requestAnimationFrame(t=>{last=t;frame(t);});
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
