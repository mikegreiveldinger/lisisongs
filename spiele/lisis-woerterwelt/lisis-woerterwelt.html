:root{
  --papier:#fff8ec; --weiss:#ffffff; --tinte:#2f2a44; --sanft:#6b6480; --linie:#e6e0f0;
  --rot:#ef6f6c; --orange:#f7a541; --gelb:#f2c14e; --gruen:#4fb984; --blau:#4ea8de; --lila:#9b7fd4;
  --marke:#f3bb1c; --marke-dunkel:#d99a00; --creme:#fff4dc;
  --gut:#e3f6ea; --falsch:#fde8e8;
  --der:#2f7fb3; --die:#d9504c; --das:#33946a;
  --blau-schatten:#2f7fb3; --gruen-schatten:#33946a; --gelb-schatten:#c99a10;
  --f-titel:Fredoka,"Trebuchet MS",system-ui,sans-serif;
  --f-text:Andika,"Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--tinte);font-family:var(--f-text);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden;
  background-color:var(--papier);
  background-image:radial-gradient(circle at 12% 18%,#ffe3c2 0 6px,transparent 7px),radial-gradient(circle at 82% 8%,#d9f0ff 0 8px,transparent 9px),
    radial-gradient(circle at 70% 70%,#e4f6e9 0 7px,transparent 8px),radial-gradient(circle at 30% 85%,#f1e6ff 0 6px,transparent 7px);
  background-size:260px 260px}
body.caps .wd{text-transform:uppercase;letter-spacing:.04em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--blau);outline-offset:3px}
img{max-width:100%}
.regenbogen{height:8px;background:linear-gradient(90deg,var(--rot),var(--orange),var(--gelb),var(--gruen),var(--blau),var(--lila))}
#app{max-width:820px;margin:0 auto;min-height:calc(100% - 8px);display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 18px}
h1,h2,h3{font-family:var(--f-titel);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}

/* Bausteine */
.tile{background:var(--weiss);border:3px solid var(--linie);border-radius:22px;box-shadow:0 5px 0 rgba(47,42,68,.08);
  transition:transform .1s,box-shadow .1s,border-color .15s,background .15s}
.tile:hover:not(:disabled){transform:translateY(-2px)}
.tile:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(47,42,68,.08)}
.tile:disabled{cursor:default}
.knopf{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:600 21px var(--f-titel);color:#fff;
  background:var(--blau);border:0;border-radius:999px;padding:11px 26px;box-shadow:0 5px 0 var(--blau-schatten)}
.knopf:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blau-schatten)}
.knopf.gruen{background:var(--gruen);box-shadow:0 5px 0 var(--gruen-schatten)}
.knopf.gruen:active{box-shadow:0 2px 0 var(--gruen-schatten)}

function pickVoice(){

    voice = vs.find(v=>/^de[-_]DE/i.test(v.lang) && /Anna|Petra|Helena|Katja|Marlene|Vicki|Google/i.test(v.name))
         || vs.find(v=>/^de/i.test(v.lang)) || null;
  }catch(e){}
}

function say(text){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(text);
      u.lang='de-DE'; if(voice) u.voice=voice; u.rate=.82; u.pitch=1.15;
      speechSynthesis.speak(u);
    },60);
  }catch(e){}
}

let actx=null;
function tone(freqs, dur=.13, type='sine', gap=.1, vol=.18){
  if(!settings.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t0=actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=f;
      const s=t0+i*gap;
      g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(vol,s+.015); g.gain.exponentialRampToValueAtTime(.001,s+dur);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s+dur+.02);
    });
  }catch(e){}
}

  tick:i=>tone([600+i*25],.07,'triangle',0,.09),
  win:()=>tone([523,659,784,1047,784,1047,1319],.24,'triangle',.13),

let G=null;
/* 20 Aufgaben: zuerst die Übungswörter, dann gemischt; nie zweimal dasselbe Wort direkt hintereinander. */
function baueRunde(pool, fokus){
  const out=[]; let bag=shuffle(fokus.filter(w=>pool.includes(w)));
  while(out.length<RUNDE){
    if(!bag.length) bag=shuffle(pool);
    let i=bag.findIndex(w=>w!==out[out.length-1]); if(i<0) i=0;
    out.push(bag.splice(i,1)[0]);
  }
  return out;
}
function startGame(t,gid,fokus=[]){
  hush();
  G={t, gid, correct:0, done:0, total:RUNDE, queue:[], missed:new Map(), cur:null, wrongNow:false, busy:false, fokus};
  app.innerHTML = `
    <div class="play">
      <div class="topbar">
        <button class="tile zu" id="quit" aria-label="Spiel beenden">✕</button>
        <div class="progress" role="progressbar" aria-label="Fortschritt"><i id="bar"></i></div>
        <span class="stand" id="stand">0/${RUNDE}</span>
      </div>
      <div class="stage" id="stage"></div>
      <div class="say">${lisi('happy')}<div class="bubble" id="talk"></div></div>
    </div>`;
  $('#quit').onclick=()=>{ G=null; topicView(t); };
  if(gid==='memory') return memory();
  let pool = gid==='artikel' ? nouns(t) : t.words;
  if(gid==='buchstaben'){ const short=pool.filter(w=>w.w.length<=7); if(short.length>=6) pool=short; }
  G.queue = baueRunde(pool, fokus);
  next();
}
function talk(text, mood){
  const b=$('#talk'); if(!b) return;
  b.textContent=text; b.classList.remove('neu'); void b.offsetWidth; b.classList.add('neu');
  const img=app.querySelector('.say .lisi');
  if(mood && img){
    const src=IMG[MOOD[mood]];
    if(img.getAttribute('src')!==src) img.src=src;
    act(img, mood==='cheer'?'hop':mood==='think'?'nein':'reden');
  } else act(img,'reden');
}
function bar(){
  const b=$('#bar'); if(b) b.style.width=(G.done/G.total*100)+'%';
  const s=$('#stand'); if(s) s.textContent=`${G.done}/${G.total}`;
}
function next(){
  if(!G) return;
  bar();
  if(!G.queue.length) return finish();
  G.cur=G.queue.shift(); G.wrongNow=false; G.busy=false;
  ({hoeren:qHoeren, lesen:qLesen, artikel:qArtikel, buchstaben:qBuchstaben})[G.gid]();
}
function wrong(el){
  sfx.bad();
  if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  if(!G.wrongNow){ G.wrongNow=true; G.missed.set(G.cur.id, G.cur); }
  talk(rnd(OOPS),'think');
}
function right(){
  G.busy=true; sfx.good(); if(!G.wrongNow) G.correct++; G.done++; bar();
  talk(G.wrongNow?'Jetzt hast du es! Weiter geht es.':rnd(PRAISE),'cheer');
  later(()=>G&&say(spoken(G.cur)), 250);
  later(()=>{ if(G) next(); }, 1500);
}
const speakBtn = (cls='') => `<button class="speak ${cls}" id="replay" aria-label="Nochmal hören">${LAUT}</button>`;

function qHoeren(){
  const c=G.cur, opts=shuffle([c,...pick(G.t.words,3,c)]);
  $('#stage').innerHTML = `
    ${speakBtn()}
    <div class="task">Was hörst du?</div>
    <div class="grid4">${opts.map(o=>`<button class="tile choice pop" data-id="${o.id}" aria-label="Bild">${pic(o)}</button>`).join('')}</div>`;
  talk('Hör gut zu und tipp auf das Bild.','happy');
  const play=()=>say(spoken(c));
  $('#replay').onclick=play; later(play,300);
  $('#stage').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
    if(G.busy||b.disabled) return;
    if(b.dataset.id===c.id){ b.classList.add('ok'); right(); }
    else { b.classList.add('no'); b.disabled=true; wrong(b); later(play,500); }
  });
}
function qLesen(){
  const c=G.cur, opts=shuffle([c,...pick(G.t.words,2,c)]);
  $('#stage').innerHTML = `
    <div class="picbig pop">${pic(c)}</div>
    <div class="task">Was ist das?</div>
    <div class="words">${opts.map(o=>`<button class="tile wordbtn wd" data-id="${o.id}">${spoken(o)}</button>`).join('')}</div>`;
  talk('Lies genau. Welches Wort passt zum Bild?','look');
  $('#stage').querySelectorAll('.wordbtn').forEach(b=>b.onclick=()=>{
    if(G.busy||b.disabled) return;
    if(b.dataset.id===c.id){ b.classList.add('ok'); right(); }
    else { b.classList.add('no'); b.disabled=true; wrong(b); }
  });
}
function qArtikel(){
  const c=G.cur;
  $('#stage').innerHTML = `
    <div class="picbig pop">${pic(c)}</div>
    <div class="sentence wd"><span class="blank" id="blank">?</span><span>${c.w}</span></div>
    <div class="arts">${['der','die','das'].map(a=>`<button class="tile art wd" data-a="${a}">${a}</button>`).join('')}</div>`;
  talk('Der, die oder das? Was klingt richtig?','happy');
  $('#stage').querySelectorAll('.art').forEach(b=>b.onclick=()=>{
    if(G.busy||b.disabled) return;
    if(b.dataset.a===c.a){
      b.classList.add('ok'); const bl=$('#blank'); bl.textContent=c.a; bl.classList.add('filled'); bl.style.color=artColor(c.a); right();
    } else { b.classList.add('no'); b.disabled=true; wrong(b); }
  });
}
function qBuchstaben(){
  const c=G.cur, letters=Array.from(c.w);
  const isL = ch => /\p{L}/u.test(ch);
  let pos=0; while(pos<letters.length && !isL(letters[pos])) pos++;
  const tiles = shuffle(letters.filter(isL));
  $('#stage').innerHTML = `
    <div style="display:flex;align-items:center;gap:16px">
      <div class="picbig pop" style="width:min(42vw,150px)">${pic(c)}</div>
      ${speakBtn('small')}
    </div>
    <div class="slots wd">${letters.map((ch,i)=>`<span class="slot${isL(ch)?'':' full'}" data-i="${i}">${isL(ch)?'':ch}</span>`).join('')}</div>
    <div class="tiles wd">${tiles.map(ch=>`<button class="tile letter">${ch}</button>`).join('')}</div>`;
  talk('Hör zu und leg das Wort. Welcher Buchstabe kommt zuerst?','happy');
  const play=()=>say(c.w); $('#replay').onclick=play; later(play,300);
  const mark=()=>app.querySelectorAll('.slot').forEach((s,i)=>s.classList.toggle('on',i===pos));
  mark();
  $('#stage').querySelectorAll('.letter').forEach(b=>b.onclick=()=>{
    if(G.busy||b.classList.contains('used')) return;
    const want=letters[pos];
    if(b.textContent.toLowerCase()===want.toLowerCase()){
      b.classList.add('used'); sfx.flip();
      const s=app.querySelector(`.slot[data-i="${pos}"]`); s.textContent=want; s.classList.add('full','pop');
      pos++; while(pos<letters.length && !isL(letters[pos])) pos++;
      mark();
      if(pos>=letters.length) right();
    } else wrong(b);
  });
}

/* Memory: 10 Paare = 20 Karten. Sterne = 20 minus Fehlversuche über 8 (ein paar Fehlversuche gehören beim Memory dazu). */
function memory(){
  const words = shuffle(G.t.words).slice(0,10);
  const cards = shuffle(words.flatMap(w=>[{w,k:'p'},{w,k:'t'}]));
  G.pairs=words.length; G.found=0; G.flops=0; G.total=G.pairs; G.done=0; bar();
  $('#stand').textContent=`0/${G.pairs} Paare`;
  $('#stage').innerHTML = `
    <div class="task">Finde die Paare!</div>
    <div class="mem zehn">${cards.map((c,i)=>`<button class="tile card" data-i="${i}" aria-label="Karte ${i+1}"><img class="back" src="${IMG.stern}" alt=""><span class="face wd">${c.k==='p'?pic(c.w):spoken(c.w)}</span></button>`).join('')}</div>`;
  talk('Dreh zwei Karten um. Passen Bild und Wort zusammen?','look');
  let open=[], lock=false;
  const els=[...$('#stage').querySelectorAll('.card')];
  els.forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i, c=cards[i];
    if(lock||el.classList.contains('open')||el.classList.contains('done')) return;
    el.classList.add('open'); sfx.flip();
    if(c.k==='t') say(spoken(c.w));
    open.push(i);
    if(open.length<2) return;
    const [a,b]=open; open=[];
    if(cards[a].w===cards[b].w){
      [a,b].forEach(j=>{els[j].classList.remove('open');els[j].classList.add('done','pop');els[j].disabled=true});
      G.found++; G.done=G.found; bar(); $('#stand').textContent=`${G.found}/${G.pairs} Paare`;
      sfx.good(); talk(rnd(PRAISE),'cheer');
      later(()=>say(spoken(cards[a].w)),300);
      if(G.found===G.pairs){ G.correct=Math.max(0,Math.min(RUNDE, RUNDE-Math.max(0,G.flops-8))); later(()=>G&&finish(),1600); }
    } else {
      lock=true; G.flops++;
      [cards[a].w,cards[b].w].forEach(w=>G.missed.set(w.id,w));
      later(()=>{ els[a].classList.remove('open'); els[b].classList.remove('open'); lock=false; talk('Merk dir, wo die Karten liegen!','think'); },1100);
    }
  });
}

function finish(){
  const t=G.t, gid=G.gid, score=G.correct;
  const missed=[...G.missed.values()];
  const prev=starsOf(t.id,gid);
  progress[t.id]=progress[t.id]||{}; progress[t.id][gid]=Math.max(prev,score); store.set('runden20',progress);
  G=null;
  (score>=SIEG_AB ? sieg : trost)(t, gid, score, prev, gid==='memory'?[]:missed);
}

/* ---------- Siegersequenz ---------- */
function fxLayer(){ const f=document.createElement('div'); f.className='fx'; document.body.appendChild(f); return f; }
const R=(a,b)=>a+Math.random()*(b-a);
function span(cls, html, vars){ const s=document.createElement('span'); s.className=cls; s.innerHTML=html;
  Object.entries(vars||{}).forEach(([k,v])=>s.style.setProperty(k,v)); return s; }
function spielFx(f, show){
  const D=show.dinge, E=x=>`<span class="e">${x}</span>`;
  const mode=show.fx;
  if(mode==='laufen'){
    D.forEach((d,i)=>{ const s=span('laufen',`<span class="e">${d}</span>`,{'--d':(show.schnell?R(2.4,3.4):R(5,7))+'s','--v':(i*.35)+'s'}); s.style.top=R(58,84)+'vh'; f.appendChild(s); });
  }
  if(mode==='regnen'||mode==='wetter'){
    for(let i=0;i<26;i++){ const s=span('regnen',E(rnd(mode==='wetter'?['☀️','☁️','❄️','💧','💧']:D)),{'--d':R(2.6,4.2)+'s','--v':R(0,2.6)+'s','--r':R(-260,260)+'deg'}); s.style.left=R(0,94)+'vw'; f.appendChild(s); }
    if(mode==='wetter'){ f.appendChild(span('bogen','')); const s=span('wachsen gross',E('☀️'),{'--v':'1.4s'}); s.style.left='8vw'; s.style.bottom='58vh'; f.appendChild(s); }
  }
  if(mode==='wachsen'){
    const n=Math.max(12,Math.round(innerWidth/55));
    for(let i=0;i<n;i++){ const s=span('wachsen'+(i%3===0?' gross':''),E(rnd(D)),{'--v':(R(0,1.6))+'s'}); s.style.left=(i/n*100-2+R(-1,1))+'vw'; f.appendChild(s); }
  }
  if(mode==='platzen'||mode==='schule'){
    const runs = mode==='schule'?1:3;
    for(let r=0;r<runs;r++) for(let i=0;i<14;i++){
      const a=i/14*Math.PI*2+R(-.2,.2), d=R(28,46);
      const html = show.zahlen ? `<span class="e" style="font-family:var(--f-titel);font-weight:700;color:${rnd(['#ef6f6c','#f7a541','#4fb984','#4ea8de','#9b7fd4'])}">${D[i%D.length]}</span>` : E(rnd(D));
      const s=span('platzen',html,{'--dx':Math.cos(a)*d+'vmin','--dy':Math.sin(a)*d+'vmin','--v':(r*1.1+R(0,.2))+'s','--r':R(-120,120)+'deg'});
      s.style.top=(30+r*8)+'%'; f.appendChild(s);
    }
  }
  if(mode==='flattern'){
    for(let i=0;i<16;i++){ const s=span('flattern',E(rnd(D)),{'--d':R(4.5,6.5)+'s','--v':R(0,2.5)+'s','--w':R(4,12)+'vw'}); s.style.left=R(2,90)+'vw'; f.appendChild(s); }
  }
  if(mode==='klecks'){
    const cols=['#E53935','#1E6FE0','#FFD31A','#2EA44F','#FF8A1F','#8E44C9','#FF9EC4'];
    for(let i=0;i<22;i++){ const z=R(40,120); const s=span('klecks','',{'--v':R(0,2)+'s'}); Object.assign(s.style,{width:z+'px',height:z+'px',left:R(-4,92)+'vw',top:R(-4,90)+'vh',background:rnd(cols)}); f.appendChild(s); }
  }
  if(mode==='kreis'||mode==='welt'){
    const k=span('kreis',''); const n=D.length;
    D.forEach((d,i)=>k.appendChild(span('',E(d),{'--a':(i/n*360)+'deg','--rad':'min(40vw,210px)'})));
    f.appendChild(k);
    if(mode==='welt'){ const p=span('laufen',`<span class="e">✈️</span>`,{'--d':'3.6s','--v':'.4s'}); p.style.top='10vh'; f.appendChild(p); }
  }
}
function zaehle(el, bis){
  let i=0; const step=()=>{ if(!el.isConnected) return; el.textContent=i; if(i>0) sfx.tick(i); if(i<bis){ i++; later(step, 70); } };
  step();
}
function sieg(t, gid, score, prev){
  const show=SHOW[t.id];
  hush();
  app.innerHTML = `
    <div class="result sieg">
      <div class="buehne stufe">${lisi('cheer','rein')}<img class="medaille" src="${IMG.medaille}" alt=""></div>
      <h2 class="titel stufe" style="animation-delay:.5s" aria-label="${show.titel}">${bunt(show.titel)}</h2>
      ${show.fx==='schule'?`<div class="urkunde-karte"><span>Urkunde</span>für tolles Lernen in der Schule<b>${score} von ${RUNDE} Sternen</b></div>`:''}
      <div class="zaehler stufe" style="animation-delay:.9s"><img src="${IMG.stern}" alt=""><span id="zahl">0</span><small>von ${RUNDE} Sternen</small></div>
      <div class="bubble stufe" style="animation-delay:1.2s">${score===RUNDE?'Alles richtig! ':''}${show.text}${score>prev&&prev>0?' Neuer Rekord!':''}</div>
      <div class="actions stufe" style="animation-delay:1.8s">
        <button class="knopf gruen" id="again">Nochmal spielen</button>
        <button class="knopf" id="toTopic"><img class="finger links" src="${IMG.finger}" alt=""> ${t.name}</button>
      </div>
    </div>`;
  const img=app.querySelector('.result .lisi');
  later(()=>{ img.classList.remove('rein'); img.classList.add('dauerjubel'); }, 900);
  later(()=>{ img.classList.remove('dauerjubel'); }, 5200);
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) spielFx(fxLayer(), show);
  sfx.win(); later(()=>say(`${show.titel} ${score} Sterne! ${show.text}`), 500);
  later(()=>zaehle($('#zahl'), score), 1000);
  later(confetti, 1600);
  $('#again').onclick=()=>startGame(t,gid);
  $('#toTopic').onclick=()=>topicView(t);
}

/* ---------- Trostsequenz ---------- */
function trost(t, gid, score, prev, missed){
  const show=SHOW[t.id];
  hush();
  const liste = missed.slice(0,8);
  app.innerHTML = `
    <div class="result trost">
      <div class="buehne stufe">${lisi('think')}<img class="herz" src="${IMG.herz}" alt="" hidden></div>
      <h2 class="titel stufe" style="animation-delay:.4s" aria-label="Schön, dass du geübt hast!">${bunt('Schön geübt!')}</h2>
      <div class="zaehler stufe" style="animation-delay:.8s"><img src="${IMG.stern}" alt=""><span id="zahl">0</span><small>von ${RUNDE} Sternen</small></div>
      <div class="bubble stufe" style="animation-delay:1.1s">${show.trost} Ab ${SIEG_AB} Sternen wartet eine Überraschung auf dich!${score>prev&&prev>0?' Und du bist schon besser als beim letzten Mal!':''}</div>
      ${liste.length?`<p class="hinweis stufe" style="animation-delay:1.5s">Diese Wörter üben wir nochmal. Tipp drauf und hör zu:</p>
      <div class="uebenliste stufe" style="animation-delay:1.7s">${liste.map(it=>`<button class="tile chip wd" data-id="${it.id}">${pic(it)}${spoken(it)}</button>`).join('')}</div>`:''}
      <div class="actions stufe" style="animation-delay:2s">
        ${liste.length?`<button class="knopf gruen" id="practice">Diese Wörter üben</button>`:''}
        <button class="knopf${liste.length?'':' gruen'}" id="again">Nochmal spielen</button>
        <button class="knopf" id="toTopic" style="background:var(--lila);box-shadow:0 5px 0 #7a5fb5"><img class="finger links" src="${IMG.finger}" alt=""> ${t.name}</button>
      </div>
    </div>`;
  const img=app.querySelector('.result .lisi');
  later(()=>{ img.src=IMG.lacht; act(img,'hop'); app.querySelector('.herz').hidden=false; }, 1300);
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    const f=fxLayer();
    for(let i=0;i<9;i++){ const s=span('schweben',`<img src="${IMG.herz}" alt="">`,{'--d':R(5,7)+'s','--v':R(.5,3.5)+'s','--w':R(-8,8)+'vw','--s':R(30,52)+'px'}); s.style.left=R(4,88)+'vw'; f.appendChild(s); }
  }
  sfx.trost(); later(()=>say(`Nicht schlimm! Du hast ${score} Sterne gesammelt. ${show.trost}`), 400);
  later(()=>zaehle($('#zahl'), score), 900);
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ const it=liste.find(w=>w.id===b.dataset.id); say(spoken(it)); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); });
  const p=$('#practice'); if(p) p.onclick=()=>startGame(t,gid,liste);
  $('#again').onclick=()=>startGame(t,gid);
  $('#toTopic').onclick=()=>topicView(t);
}

/* ---------- Konfetti in Regenbogenfarben ---------- */
let confettiRun=0;
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const run=++confettiRun;
  const cv=$('#confetti'), ctx=cv.getContext('2d'); cv.hidden=false;
  const W=cv.width=innerWidth*devicePixelRatio, H=cv.height=innerHeight*devicePixelRatio;
  const cols=['#ef6f6c','#f7a541','#f2c14e','#4fb984','#4ea8de','#9b7fd4'];
  const P=Array.from({length:140},()=>({x:Math.random()*W,y:-Math.random()*H*.5,r:(4+Math.random()*6)*devicePixelRatio,
    vx:(Math.random()-.5)*3,vy:(2+Math.random()*4)*devicePixelRatio,a:Math.random()*6,va:(Math.random()-.5)*.3,c:rnd(cols)}));
  let f=0;
  (function loop(){
    if(run!==confettiRun) return;
    ctx.clearRect(0,0,W,H);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();});
    if(++f<220) requestAnimationFrame(loop); else { ctx.clearRect(0,0,W,H); cv.hidden=true; }
  })();
}

home();
</script>
