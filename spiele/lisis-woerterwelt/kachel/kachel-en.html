<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fredoka;font-weight:700;src:url(../schriften/fredoka-latin-700-normal.woff2)}
@font-face{font-family:Fredoka;font-weight:600;src:url(../schriften/fredoka-latin-600-normal.woff2)}
html,body{margin:0}
.k{width:1080px;height:1080px;position:relative;overflow:hidden;font-family:Fredoka,sans-serif;
  background:linear-gradient(180deg,#8fd0f5 0%,#d8f2fd 60%,#fff8ec 100%)}
.wolke{position:absolute;background:#fff;border-radius:999px;opacity:.95}
.wolke::before,.wolke::after{content:"";position:absolute;background:#fff;border-radius:50%}
.w1{left:40px;top:250px;width:150px;height:50px}.w1::before{width:70px;height:70px;left:25px;top:-35px}.w1::after{width:50px;height:50px;left:80px;top:-22px}
.w2{right:60px;top:60px;width:170px;height:56px}.w2::before{width:80px;height:80px;left:30px;top:-40px}.w2::after{width:56px;height:56px;left:95px;top:-26px}
.wiese{position:absolute;left:-60px;right:-60px;bottom:-140px;height:420px;border-radius:50% 50% 0 0;background:#bfe6a8}
.wiese2{position:absolute;left:-200px;right:300px;bottom:-200px;height:420px;border-radius:50% 50% 0 0;background:#a6dc8c}
.eyebrow{position:absolute;top:58px;left:0;right:0;text-align:center;font-weight:600;font-size:30px;letter-spacing:5px;color:#5a3d8a}
h1{position:absolute;top:92px;left:0;right:0;margin:0;text-align:center;line-height:.95}
h1 .a{display:block;font-size:118px;color:#5a3d8a;-webkit-text-stroke:0;paint-order:stroke fill;text-shadow:0 6px 0 #fff,0 -2px 0 #fff,4px 0 0 #fff,-4px 0 0 #fff,0 10px 18px rgba(47,42,68,.25)}
h1 .b{display:block;font-size:178px;letter-spacing:2px;text-shadow:0 7px 0 #fff,0 -3px 0 #fff,5px 0 0 #fff,-5px 0 0 #fff,5px 5px 0 #fff,-5px 5px 0 #fff,0 14px 22px rgba(47,42,68,.28)}
h1 .b span:nth-child(6n+1){color:#ef6f6c}h1 .b span:nth-child(6n+2){color:#f7a541}h1 .b span:nth-child(6n+3){color:#e0a800}
h1 .b span:nth-child(6n+4){color:#4fb984}h1 .b span:nth-child(6n+5){color:#4ea8de}h1 .b span:nth-child(6n+6){color:#9b7fd4}
.arts{position:absolute;top:440px;left:70px;display:flex;gap:26px}
.art{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:54px;
  box-shadow:0 8px 0 rgba(0,0,0,.18),0 0 0 8px #fff}
.der{background:#2f7fb3}.die{background:#d9504c}.das{background:#33946a}
.karte{position:absolute;width:210px;height:210px;background:#fff;border-radius:30px;box-shadow:0 10px 0 rgba(47,42,68,.10),0 18px 30px rgba(47,42,68,.18);
  display:grid;place-items:center;border:6px solid var(--f)}
.karte img{width:180px;height:180px;object-fit:contain}
.k1{left:60px;top:640px;transform:rotate(-8deg);--f:#ef6f6c}
.k2{left:280px;top:690px;transform:rotate(4deg);--f:#f7a541}
.k3{left:500px;top:650px;transform:rotate(-3deg);--f:#4fb984}
.lisi{position:absolute;right:30px;bottom:24px;height:500px;filter:drop-shadow(0 10px 12px rgba(47,42,68,.2))}
.logo{position:absolute;left:34px;bottom:30px;width:130px;height:130px;border-radius:50%;box-shadow:0 0 0 7px #fff,0 0 0 12px #f3bb1c}
</style></head><body><div class="k">
<div class="wiese2"></div><div class="wiese"></div>
<div class="wolke w1"></div><div class="wolke w2"></div>
<div class="eyebrow">A WORD ADVENTURE WITH LISI</div>
<h1><span class="a">Lisi’s</span><span class="b"><span>W</span><span>o</span><span>r</span><span>d</span> <span>W</span><span>o</span><span>r</span><span>l</span><span>d</span></span></h1>
<div class="arts"><div class="art der">a</div><div class="art die">an</div></div>
<div class="karte k1"><img src="../bilder-gemalt/tiere-eule.webp"></div>
<div class="karte k2"><img src="../bilder-gemalt/essen-apfel.webp"></div>
<div class="karte k3"><img src="../bilder-gemalt/wetter-regenschirm.webp"></div>
<img class="lisi" src="lisi-winkt.png">
<img class="logo" src="../marke/lisi-logo.png">
</div></body></html>
