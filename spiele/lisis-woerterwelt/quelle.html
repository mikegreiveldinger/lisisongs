<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lisis Wörterwelt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" href="{{marke/favicon.png}}">
<style>
/* Lisi-Hausstil wie in Lisis Märchenzeit: Papier mit bunten Punkten, Regenbogenstreifen, weiße Karten mit farbigem Rand,
   Fredoka für Überschriften, Andika zum Lesen, gemalte Lisi-Symbole statt Emojis in der Bedienung. Bewusst nur helles Design. */
@font-face{font-family:Andika;font-weight:400;font-display:swap;src:url({{schriften/andika-latin-400-normal.woff2}}) format("woff2")}
@font-face{font-family:Andika;font-weight:700;font-display:swap;src:url({{schriften/andika-latin-700-normal.woff2}}) format("woff2")}
@font-face{font-family:Fredoka;font-weight:600;font-display:swap;src:url({{schriften/fredoka-latin-600-normal.woff2}}) format("woff2")}
@font-face{font-family:Fredoka;font-weight:700;font-display:swap;src:url({{schriften/fredoka-latin-700-normal.woff2}}) format("woff2")}
:root{
  --papier:#fff8ec; --weiss:#ffffff; --tinte:#2f2a44; --sanft:#6b6480; --linie:#e6e0f0;
  --rot:#ef6f6c; --orange:#f7a541; --gelb:#f2c14e; --gruen:#4fb984; --blau:#4ea8de; --lila:#9b7fd4;
  --marke:#f3bb1c; --marke-dunkel:#d99a00; --creme:#fff4dc;
  --gut:#e3f6ea; --falsch:#fde8e8;
  --der:#2f7fb3; --die:#d9504c; --das:#33946a;
  --blau-schatten:#2f7fb3; --gruen-schatten:#33946a; --gelb-schatten:#c99a10;
  --f-titel:Fredoka,"Trebuchet MS",system-ui,sans-serif;
  --f-text:Andika,"Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--tinte);font-family:var(--f-text);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden;
  background-color:var(--papier);
  background-image:radial-gradient(circle at 12% 18%,#ffe3c2 0 6px,transparent 7px),radial-gradient(circle at 82% 8%,#d9f0ff 0 8px,transparent 9px),
    radial-gradient(circle at 70% 70%,#e4f6e9 0 7px,transparent 8px),radial-gradient(circle at 30% 85%,#f1e6ff 0 6px,transparent 7px);
  background-size:260px 260px}
body.caps .wd{text-transform:uppercase;letter-spacing:.04em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--blau);outline-offset:3px}
img{max-width:100%}
.regenbogen{height:8px;background:linear-gradient(90deg,var(--rot),var(--orange),var(--gelb),var(--gruen),var(--blau),var(--lila))}
#app{max-width:820px;margin:0 auto;min-height:calc(100% - 8px);display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 18px}
h1,h2,h3{font-family:var(--f-titel);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}

/* Bausteine */
.tile{background:var(--weiss);border:3px solid var(--linie);border-radius:22px;box-shadow:0 5px 0 rgba(47,42,68,.08);
  transition:transform .1s,box-shadow .1s,border-color .15s,background .15s}
.tile:hover:not(:disabled){transform:translateY(-2px)}
.tile:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(47,42,68,.08)}
.tile:disabled{cursor:default}
.knopf{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:600 21px var(--f-titel);color:#fff;
  background:var(--blau);border:0;border-radius:999px;padding:11px 26px;box-shadow:0 5px 0 var(--blau-schatten)}
.knopf:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blau-schatten)}
.knopf.gruen{background:var(--gruen);box-shadow:0 5px 0 var(--gruen-schatten)}
.knopf.gruen:active{box-shadow:0 2px 0 var(--gruen-schatten)}
.pille{display:inline-flex;align-items:center;gap:8px;font:600 17px var(--f-titel);color:var(--sanft);background:var(--weiss);
  border:0;border-radius:999px;padding:7px 15px;box-shadow:0 3px 0 rgba(47,42,68,.08);white-space:nowrap}
.pille img{height:1.35em;width:auto}
.finger{height:1.05em;width:auto;vertical-align:middle}
.finger.links{transform:scaleX(-1)}
.symbol{height:1.4em;width:auto;vertical-align:middle}

/* Kopf */
.kopf{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.marke{display:flex;align-items:center;gap:10px;font:600 20px var(--f-titel);color:var(--tinte);background:var(--weiss);
  border:0;border-radius:999px;padding:4px 18px 4px 4px;box-shadow:0 3px 0 rgba(47,42,68,.08)}
.marke img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--marke)}
.marke b{color:var(--marke-dunkel);font-weight:700}
.schalter{display:flex;gap:8px}
.pille[aria-pressed="false"]{opacity:.55}
.pille svg{width:20px;height:20px}
.sternzahl{font-variant-numeric:tabular-nums;color:var(--tinte)}

.hero{display:flex;align-items:flex-end;gap:10px;padding-top:12px}
.hero .lisi{width:128px;flex:none}
.bubble{position:relative;background:var(--weiss);border:3px solid var(--linie);border-radius:22px;padding:12px 16px;min-width:0;margin-bottom:22px;flex:1}
.bubble::after{content:"";position:absolute;left:-12px;bottom:20px;width:18px;height:18px;background:var(--weiss);
  border-left:3px solid var(--linie);border-bottom:3px solid var(--linie);transform:rotate(45deg)}
.bubble b{font-family:var(--f-titel);font-weight:600;font-size:1.3rem;display:block;line-height:1.15;margin-bottom:2px}
.titel{font-size:clamp(34px,7vw,52px);font-weight:700;letter-spacing:.5px;text-align:center;margin:18px 0 4px}
.titel span:nth-child(6n+1){color:var(--rot)}.titel span:nth-child(6n+2){color:var(--orange)}.titel span:nth-child(6n+3){color:var(--gruen)}
.titel span:nth-child(6n+4){color:var(--blau)}.titel span:nth-child(6n+5){color:var(--lila)}.titel span:nth-child(6n+6){color:#e0a800}
.unter{text-align:center;color:var(--sanft);margin:0 0 6px}
.etikett{font:600 15px var(--f-titel);color:#fff;background:var(--f,var(--orange));border-radius:999px;padding:3px 14px;align-self:flex-start;margin:18px 0 10px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.topic{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 10px 12px;text-align:center;border-color:var(--f);border-width:4px}
.topic .big{font-size:3rem;line-height:1.15}
.topic h3{font-size:1.25rem}
.meter{width:80%;height:10px;border-radius:99px;background:var(--linie);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--marke);border-radius:99px}
.topic small{color:var(--sanft);font-variant-numeric:tabular-nums}
.fuss{margin-top:auto;padding-top:26px;text-align:center;font-size:14px;color:var(--sanft)}

/* Themenseite */
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h2{font-size:1.9rem;flex:1;min-width:0;color:var(--f,var(--tinte))}
.games{display:grid;gap:12px}
.game{display:flex;align-items:center;gap:14px;padding:12px 16px;text-align:left;width:100%;border-color:var(--f);border-width:4px}
.game .gi{width:58px;height:58px;display:grid;place-items:center;background:var(--creme);border-radius:18px;flex:none}
.game .gi img{max-width:46px;max-height:46px}
.game .gt{flex:1;min-width:0}
.game h3{font-size:1.25rem}
.game p{margin:0;color:var(--sanft);font-size:.95rem}
.stars{display:flex;gap:2px;flex:none}
.stars img{width:24px;height:24px}
img.leer{filter:grayscale(1);opacity:.3}

/* Spiel */
.play{display:flex;flex-direction:column;flex:1;min-height:0}
.topbar{display:flex;align-items:center;gap:12px}
.zu{width:46px;height:46px;border-radius:50%;padding:0;display:grid;place-items:center;font:700 20px var(--f-titel);color:var(--sanft);flex:none}
.progress{flex:1;height:20px;background:var(--weiss);border:3px solid var(--linie);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gruen),#7fd3a6);border-radius:99px;transition:width .35s ease}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:18px}
.task{font:600 1.4rem var(--f-titel);text-align:center;color:var(--sanft)}
.speak{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;border:0;background:var(--blau);box-shadow:0 6px 0 var(--blau-schatten)}
.speak svg{width:50px;height:50px}
.speak:active{transform:translateY(4px);box-shadow:0 2px 0 var(--blau-schatten)}
.speak.small{width:60px;height:60px;box-shadow:0 4px 0 var(--blau-schatten)}
.speak.small svg{width:32px;height:32px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:min(100%,420px)}
.choice{aspect-ratio:1;display:grid;place-items:center;padding:6px;max-width:100%}
.ok{background:var(--gut)!important;border-color:var(--gruen)!important}
.no{background:var(--falsch)!important;border-color:var(--rot)!important;opacity:.75}
.emo{font-size:clamp(3.4rem,15vw,5rem);line-height:1}
.picbig{width:min(62vw,210px);aspect-ratio:1;display:grid;place-items:center;background:var(--weiss);border:4px solid var(--f,var(--marke));border-radius:28px;box-shadow:0 6px 0 rgba(47,42,68,.07)}
.picbig .emo{font-size:clamp(5rem,26vw,8rem)}
.swatch{display:block;width:70%;aspect-ratio:1;border-radius:50%;background:var(--sw);border:3px solid var(--linie);box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.num{display:flex;flex-direction:column;align-items:center;gap:4px}
.num b{font-family:var(--f-titel);font-weight:700;font-size:clamp(3.2rem,14vw,5rem);line-height:.9;color:var(--blau)}
.num i{font-style:normal;color:var(--orange);font-size:.9rem;letter-spacing:2px;max-width:7.5em;text-align:center;line-height:1.1}
.words{display:grid;gap:12px;width:min(100%,420px)}
.wordbtn{padding:14px 12px;font-size:1.6rem;font-weight:700}
.sentence{font-size:2.1rem;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.blank{display:inline-block;min-width:2.8em;border-bottom:4px dashed var(--sanft);text-align:center;color:var(--sanft)}
.blank.filled{border-bottom-style:solid}
.arts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(100%,420px)}
.art{padding:16px 0;font-size:1.7rem;font-weight:700;border-width:4px}
.art[data-a="der"]{color:var(--der);border-color:#cfe6f6}.art[data-a="die"]{color:var(--die);border-color:#fbd3d2}.art[data-a="das"]{color:var(--das);border-color:#cdeedb}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.slot{width:42px;height:54px;border-bottom:5px solid var(--linie);display:grid;place-items:center;font-size:2rem;font-weight:700}
.slot.on{border-color:var(--marke)}
.slot.full{border-color:var(--gruen)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:440px}
.letter{width:56px;height:62px;font-size:1.9rem;font-weight:700;padding:0}
.letter.used{visibility:hidden}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,460px)}
@media (min-width:560px){.mem{grid-template-columns:repeat(4,1fr)}}
.card{aspect-ratio:1;padding:4px;display:grid;place-items:center;overflow:hidden}
.card .face{display:none;font-size:1.1rem;font-weight:700;text-align:center;line-height:1.15;overflow-wrap:anywhere}
.card .face .emo{font-size:clamp(2.4rem,11vw,3.4rem)}
.card .face .swatch{width:62%;margin:auto}
.card .face .num b{font-size:2.6rem}.card .face .num i{font-size:.6rem}
.card .back{width:58%;opacity:.9}
.card:not(.open):not(.done){background:var(--creme);border-color:#f6dd9a}
.card.open .face,.card.done .face{display:block}
.card.open .back,.card.done .back{display:none}
.card.done{background:var(--gut);border-color:var(--gruen)}

.say{display:flex;align-items:flex-end;gap:10px;min-height:96px}
.say .lisi{width:92px;flex:none}
.say .bubble{margin-bottom:18px}
.hop{animation:hop .5s ease}
.shake{animation:shake .4s ease}
.pop{animation:pop .35s ease both}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-16px) rotate(-4deg)}65%{transform:translateY(-6px) rotate(3deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.7);opacity:.3}100%{transform:scale(1);opacity:1}}

/* Ergebnis */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding-block:20px}
.result .lisi{width:170px}
.result h2{font-size:2.6rem;font-weight:700;color:var(--gruen-schatten)}
.bigstars{display:flex;gap:8px}
.bigstars img{width:64px;height:64px}
.result .bubble{margin:0;flex:none}
.result .bubble::after{display:none}
.actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:6px}

/* Wörterliste */
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--sanft);font-size:.95rem;margin:10px 4px 12px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;background:var(--c);vertical-align:-1px}
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:8px}
.wcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 10px;border-top:7px solid var(--c,var(--linie))}
.wcard .emo{font-size:3rem}
.wcard .swatch{width:58px}
.wcard .num b{font-size:2.6rem}
.wcard .wd{font-size:1.2rem;font-weight:700;text-align:center;overflow-wrap:anywhere}
.wcard .wd em{font-style:normal;color:var(--c)}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
@media (max-width:420px){.marke{font-size:17px}.marke img{width:36px;height:36px}.pille{font-size:15px;padding:6px 12px}.hero .lisi{width:104px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="regenbogen"></div>
<div id="app"></div>
<canvas id="confetti" hidden></canvas>

<script>
/* ---------- Bilder aus dem Lisi-Markenordner ---------- */
const IMG = {
  logo:'{{marke/lisi-logo.png}}', lacht:'{{marke/symbol-lisi-lacht.png}}', denkt:'{{marke/symbol-lisi-denkt.png}}',
  jubelt:'{{marke/symbol-lisi-jubelt.png}}', lupe:'{{marke/symbol-lisi-lupe.png}}', stern:'{{marke/symbol-stern.png}}',
  medaille:'{{marke/symbol-medaille.png}}', finger:'{{marke/symbol-finger.png}}', buch:'{{marke/symbol-buch.png}}',
  rolle:'{{marke/symbol-schriftrolle.png}}', krone:'{{marke/symbol-krone.png}}', herz:'{{marke/symbol-herz.png}}'
};
const FARBEN = ['var(--rot)','var(--orange)','var(--gruen)','var(--blau)','var(--lila)','var(--gelb)'];
const LAUT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#fff"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>';
const LAUT_KLEIN = on => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>${on?'<path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>':'<path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>'}</svg>`;

/* ---------- Wörter ---------- */
const RAW = [
  {id:'tiere', name:'Tiere', icon:'🐶', words:[
    ['der','Hund','🐶'],['die','Katze','🐱'],['die','Maus','🐭'],['das','Pferd','🐴'],['die','Kuh','🐮'],
    ['das','Schwein','🐷'],['das','Huhn','🐔'],['die','Ente','🦆'],['der','Fisch','🐟'],['der','Vogel','🐦'],
    ['der','Hase','🐰'],['der','Bär','🐻'],['das','Schaf','🐑'],['der','Frosch','🐸'],['das','Eichhörnchen','🐿️'],['die','Eule','🦉']]},
  {id:'essen', name:'Essen', icon:'🍎', words:[
    ['der','Apfel','🍎'],['die','Banane','🍌'],['das','Brot','🍞'],['der','Käse','🧀'],['das','Ei','🥚'],
    ['die','Milch','🥛'],['die','Erdbeere','🍓'],['die','Karotte','🥕'],['der','Kuchen','🍰'],['das','Eis','🍦'],
    ['die','Birne','🍐'],['die','Tomate','🍅'],['der','Kürbis','🎃'],['die','Suppe','🍲'],['die','Brezel','🥨']]},
  {id:'kleidung', name:'Kleidung', icon:'🧣', words:[
    ['der','Schal','🧣'],['der','Handschuh','🧤'],['die','Jacke','🧥'],['die','Hose','👖'],['das','Kleid','👗'],
    ['der','Schuh','👟'],['der','Stiefel','👢'],['die','Socke','🧦'],['der','Hut','🎩'],['das','T-Shirt','👕'],
    ['die','Brille','👓'],['der','Rucksack','🎒'],['die','Kappe','🧢'],['der','Schirm','☂️']]},
  {id:'koerper', name:'Mein Körper', icon:'👂', words:[
    ['das','Auge','👁️'],['das','Ohr','👂'],['die','Nase','👃'],['der','Mund','👄'],['die','Hand','✋'],
    ['der','Fuß','🦶'],['das','Bein','🦵'],['der','Zahn','🦷'],['der','Arm','💪'],['die','Zunge','👅'],
    ['der','Daumen','👍'],['das','Herz','❤️']]},
  {id:'zuhause', name:'Zuhause', icon:'🏠', words:[
    ['das','Haus','🏠'],['die','Tür','🚪'],['das','Bett','🛏️'],['der','Stuhl','🪑'],['die','Lampe','💡'],
    ['die','Uhr','⏰'],['der','Schlüssel','🔑'],['das','Buch','📖'],['der','Ball','⚽'],['der','Teddy','🧸'],
    ['die','Tasse','☕'],['der','Löffel','🥄'],['die','Kerze','🕯️'],['das','Fenster','🪟']]},
  {id:'fahrzeuge', name:'Fahrzeuge', icon:'🚗', words:[
    ['das','Auto','🚗'],['der','Bus','🚌'],['der','Zug','🚂'],['das','Fahrrad','🚲'],['das','Flugzeug','✈️'],
    ['das','Schiff','🚢'],['das','Boot','⛵'],['die','Rakete','🚀'],['der','Traktor','🚜'],['der','Hubschrauber','🚁'],
    ['die','Feuerwehr','🚒'],['der','Roller','🛴'],['der','Laster','🚚']]},
  {id:'natur', name:'Natur und Wetter', icon:'🌈', words:[
    ['die','Sonne','☀️'],['der','Mond','🌙'],['der','Stern','⭐'],['die','Wolke','☁️'],['der','Regen','🌧️'],
    ['der','Schnee','❄️'],['der','Baum','🌳'],['die','Blume','🌸'],['der','Regenbogen','🌈'],['das','Blatt','🍂'],
    ['der','Berg','⛰️'],['der','Pilz','🍄'],['der','Blitz','⚡'],['das','Feuer','🔥']]},
  {id:'farben', name:'Farben', icon:'🎨', noArt:true, words:[
    [null,'rot','#E53935'],[null,'blau','#1E6FE0'],[null,'gelb','#FFD31A'],[null,'grün','#2EA44F'],
    [null,'orange','#FF8A1F'],[null,'lila','#8E44C9'],[null,'rosa','#FF9EC4'],[null,'braun','#8B5A2B'],
    [null,'schwarz','#1B1B1B'],[null,'weiß','#FFFFFF'],[null,'grau','#9AA3AA']]},
  {id:'zahlen', name:'Zahlen', icon:'🔢', noArt:true, words:
    ['eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn'].map((w,i)=>[null,w,i+1])}
];
const TOPICS = RAW.map((t,ti)=>({...t, farbe:FARBEN[ti%6], words:t.words.map(([a,w,x],i)=>{
  const it={id:t.id+i, a, w};
  if(t.id==='farben') it.c=x; else if(t.id==='zahlen') it.n=x; else it.e=x;
  return it;
})}));

const GAMES = [
  {id:'hoeren', bild:'finger', name:'Hören und tippen', desc:'Lisi sagt ein Wort. Tipp auf das richtige Bild.'},
  {id:'lesen', bild:'lupe', name:'Wort finden', desc:'Welches Wort gehört zum Bild?'},
  {id:'artikel', bild:'denkt', name:'Der, die oder das?', desc:'Welcher Begleiter passt?', nouns:true},
  {id:'buchstaben', bild:'rolle', name:'Buchstaben legen', desc:'Leg das Wort Buchstabe für Buchstabe.'},
  {id:'memory', bild:'krone', name:'Memory', desc:'Finde Bild und Wort, die zusammengehören.'}
];
const gamesFor = t => GAMES.filter(g=>!(g.nouns && t.noArt));

/* ---------- Speicher ---------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem('lisi-'+k); return v?JSON.parse(v):d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem('lisi-'+k, JSON.stringify(v)) }catch(e){} }
};
let progress = store.get('progress', {});
let settings = store.get('settings', {sound:true, caps:false});
const starsOf = (t,g) => (progress[t]&&progress[t][g])||0;
const topicStars = t => gamesFor(t).reduce((s,g)=>s+starsOf(t.id,g.id),0);
const totalStars = () => TOPICS.reduce((s,t)=>s+topicStars(t),0);

/* ---------- Ton ---------- */
let voice=null;
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices();
    voice = vs.find(v=>/^de[-_]DE/i.test(v.lang) && /Anna|Petra|Helena|Katja|Marlene|Vicki|Google/i.test(v.name))
         || vs.find(v=>/^de/i.test(v.lang)) || null;
  }catch(e){}
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(text);
      u.lang='de-DE'; if(voice) u.voice=voice; u.rate=.82; u.pitch=1.15;
      speechSynthesis.speak(u);
    },60);
  }catch(e){}
}
const hush = () => { try{ window.speechSynthesis && speechSynthesis.cancel(); }catch(e){}
  confettiRun++; const cv=document.getElementById('confetti'); if(cv) cv.hidden=true; };
const spoken = it => it.a ? it.a+' '+it.w : it.w;

let actx=null;
function tone(freqs, dur=.13, type='sine', gap=.1, vol=.18){
  if(!settings.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t0=actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=f;
      const s=t0+i*gap;
      g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(vol,s+.015); g.gain.exponentialRampToValueAtTime(.001,s+dur);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s+dur+.02);
    });
  }catch(e){}
}
const sfx = {
  good:()=>tone([660,880],.16,'triangle',.09),
  bad:()=>tone([220,180],.18,'sine',.12,.14),
  flip:()=>tone([520],.06,'triangle',0,.08),
  win:()=>tone([523,659,784,1047],.22,'triangle',.12)
};

/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const pick = (arr,n,not) => shuffle(arr.filter(x=>x!==not)).slice(0,n);
const MOOD = {happy:'lacht', cheer:'jubelt', think:'denkt', look:'lupe'};
const lisi = (mood='happy') => `<img class="lisi" src="${IMG[MOOD[mood]]}" alt="Lisi">`;
function pic(it){
  if(it.c) return `<span class="swatch" style="--sw:${it.c}"></span>`;
  if(it.n) return `<span class="num"><b>${it.n}</b><i>${'●'.repeat(it.n)}</i></span>`;
  return `<span class="emo">${it.e}</span>`;
}
const artColor = a => a ? `var(--${a})` : 'var(--orange)';
const star = (on, extra='') => `<img src="${IMG.stern}" alt=""${on?'':' class="leer"'} ${extra}>`;
const starRow = n => `<span class="stars" role="img" aria-label="${n} von 3 Sternen">${[1,2,3].map(i=>star(i<=n)).join('')}</span>`;
const bunt = s => [...s].map(ch=>ch===' '?' ':`<span>${ch}</span>`).join('');
const back = label => `<button class="pille" id="back"><img class="finger links" src="${IMG.finger}" alt=""> ${label}</button>`;
const PRAISE = ['Super!','Toll gemacht!','Prima!','Genau!','Klasse!','Richtig!','Spitze!','Wow, du kannst das!'];
const OOPS = ['Fast! Probier es nochmal.','Hmm, das war es nicht. Noch ein Versuch!','Nicht schlimm. Versuch ein anderes!'];
const rnd = a => a[Math.floor(Math.random()*a.length)];
function applySettings(){ document.body.classList.toggle('caps', !!settings.caps); }
applySettings();

/* ---------- Startseite ---------- */
function home(){
  hush();
  const n = totalStars(), max = TOPICS.reduce((s,t)=>s+gamesFor(t).length*3,0);
  app.innerHTML = `
    <div class="kopf">
      <span class="marke"><img src="${IMG.logo}" alt=""><span><b>Lisis</b> Wörterwelt</span></span>
      <span class="schalter">
        <span class="pille sternzahl" title="Deine Sterne"><img src="${IMG.stern}" alt="">${n}<span style="color:var(--sanft);font-weight:600">/ ${max}</span></span>
        <button class="pille" id="t-caps" aria-pressed="${!!settings.caps}" title="Großbuchstaben">${settings.caps?'ABC':'Abc'}</button>
        <button class="pille" id="t-sound" aria-pressed="${!!settings.sound}" aria-label="Ton">${LAUT_KLEIN(settings.sound)}</button>
      </span>
    </div>
    <h1 class="titel" aria-label="Lisis Wörterwelt">${bunt('Lisis Wörterwelt')}</h1>
    <p class="unter">Hören, lesen und spielen mit deutschen Wörtern</p>
    <div class="hero">
      ${lisi('happy')}
      <div class="bubble"><b>Hallo, ich bin Lisi!</b>Ich frage immer nach. Komm, wir lernen zusammen neue Wörter. Wähl ein Thema!</div>
    </div>
    <span class="etikett" style="--f:var(--orange)">Themen</span>
    <div class="topics">
      ${TOPICS.map(t=>{ const s=topicStars(t), m=gamesFor(t).length*3; return `
        <button class="tile topic" data-t="${t.id}" style="--f:${t.farbe}">
          <span class="big" aria-hidden="true">${t.icon}</span>
          <h3>${t.name}</h3>
          <span class="meter"><i style="width:${Math.round(s/m*100)}%"></i></span>
          <small>${s} von ${m} Sternen</small>
        </button>`}).join('')}
    </div>
    <div class="fuss">Lisi fragt nach · Lisis Wörterwelt</div>`;
  app.querySelectorAll('.topic').forEach(b=>b.onclick=()=>topicView(TOPICS.find(t=>t.id===b.dataset.t)));
  $('#t-caps').onclick=()=>{ settings.caps=!settings.caps; store.set('settings',settings); applySettings(); home(); };
  $('#t-sound').onclick=()=>{ settings.sound=!settings.sound; store.set('settings',settings); home(); if(settings.sound) sfx.good(); };
}

/* ---------- Thema ---------- */
function topicView(t){
  hush();
  app.style.setProperty('--f', t.farbe);
  app.innerHTML = `
    <div class="head">${back('Alle Themen')}</div>
    <div class="hero">
      ${lisi('look')}
      <div class="bubble"><b>${t.icon} ${t.name}</b>${t.words.length} Wörter warten auf dich. Was wollen wir spielen?</div>
    </div>
    <div class="games">
      <button class="tile game" data-g="woerter">
        <span class="gi"><img src="${IMG.buch}" alt=""></span>
        <span class="gt"><h3>Alle Wörter ansehen</h3><p>Tipp auf ein Bild und hör zu.</p></span>
      </button>
      ${gamesFor(t).map(g=>`
        <button class="tile game" data-g="${g.id}">
          <span class="gi"><img src="${IMG[g.bild]}" alt=""></span>
          <span class="gt"><h3>${g.name}</h3><p>${g.desc}</p></span>
          ${starRow(starsOf(t.id,g.id))}
        </button>`).join('')}
    </div>`;
  $('#back').onclick=()=>{ app.style.removeProperty('--f'); home(); };
  app.querySelectorAll('.game').forEach(b=>b.onclick=()=> b.dataset.g==='woerter' ? wordList(t) : startGame(t,b.dataset.g));
}

function wordList(t){
  app.innerHTML = `
    <div class="head">${back(t.name)}<h2>Alle Wörter</h2></div>
    ${t.noArt?'':`<div class="legend"><span style="--c:var(--der)">der</span><span style="--c:var(--die)">die</span><span style="--c:var(--das)">das</span></div>`}
    <div class="wordgrid">
      ${t.words.map(it=>`
        <button class="tile wcard" data-id="${it.id}" style="--c:${artColor(it.a)}">
          ${pic(it)}<span class="wd">${it.a?`<em>${it.a}</em> `:''}${it.w}</span>
        </button>`).join('')}
    </div>`;
  $('#back').onclick=()=>topicView(t);
  app.querySelectorAll('.wcard').forEach(b=>b.onclick=()=>{
    const it=t.words.find(w=>w.id===b.dataset.id); say(spoken(it));
    b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  });
}

/* ---------- Spiel ---------- */
let G=null;
function startGame(t,gid){
  hush();
  G={t, gid, mistakes:0, done:0, total:0, queue:[], retried:new Set(), cur:null, wrongNow:false, busy:false};
  app.innerHTML = `
    <div class="play">
      <div class="topbar">
        <button class="tile zu" id="quit" aria-label="Spiel beenden">✕</button>
        <div class="progress" role="progressbar" aria-label="Fortschritt"><i id="bar"></i></div>
      </div>
      <div class="stage" id="stage"></div>
      <div class="say"><span id="lisiBox">${lisi('happy')}</span><div class="bubble" id="talk"></div></div>
    </div>`;
  $('#quit').onclick=()=>{ G=null; topicView(t); };
  if(gid==='memory') return memory();
  let pool = t.words;
  if(gid==='buchstaben'){ const short=t.words.filter(w=>w.w.length<=7); if(short.length>=6) pool=short; }
  G.queue = shuffle(pool).slice(0,8);
  G.total = G.queue.length;
  next();
}
function talk(text, mood){
  $('#talk').textContent=text;
  if(mood){ const box=$('#lisiBox'); box.innerHTML=lisi(mood); if(mood==='cheer') box.firstElementChild.classList.add('hop'); }
}
function bar(){ const b=$('#bar'); if(b) b.style.width = (G.total? G.done/G.total*100 : 0)+'%'; }
function next(){
  if(!G) return;
  bar();
  if(!G.queue.length) return finish();
  G.cur=G.queue.shift(); G.wrongNow=false; G.busy=false;
  ({hoeren:qHoeren, lesen:qLesen, artikel:qArtikel, buchstaben:qBuchstaben})[G.gid]();
}
function wrong(el){
  sfx.bad();
  if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  if(!G.wrongNow){ G.wrongNow=true; G.mistakes++;
    if(!G.retried.has(G.cur.id)){ G.retried.add(G.cur.id); G.queue.push(G.cur); G.total++; bar(); } }
  talk(rnd(OOPS),'think');
}
function right(){
  G.busy=true; sfx.good(); G.done++; bar();
  talk(rnd(PRAISE),'cheer');
  setTimeout(()=>G&&say(spoken(G.cur)), 250);
  setTimeout(()=>{ if(G) next(); }, 1500);
}
const speakBtn = (cls='') => `<button class="speak ${cls}" id="replay" aria-label="Nochmal hören">${LAUT}</button>`;

function qHoeren(){
  const c=G.cur, opts=shuffle([c,...pick(G.t.words,3,c)]);
  $('#stage').innerHTML = `
    ${speakBtn()}
    <div class="task">Was hörst du?</div>
    <div class="grid4">${opts.map(o=>`<button class="tile choice" data-id="${o.id}" aria-label="Bild">${pic(o)}</button>`).join('')}</div>`;
  talk('Hör gut zu und tipp auf das Bild.','happy');
  const play=()=>say(spoken(c));
  $('#replay').onclick=play; setTimeout(play,300);
  $('#stage').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
    if(G.busy||b.disabled) return;
    if(b.dataset.id===c.id){ b.classList.add('ok'); right(); }
    else { b.classList.add('no'); b.disabled=true; wrong(b); setTimeout(play,500); }
  });
}
function qLesen(){
  const c=G.cur, opts=shuffle([c,...pick(G.t.words,2,c)]);
  $('#stage').innerHTML = `
    <div class="picbig pop">${pic(c)}</div>
    <div class="task">Was ist das?</div>
    <div class="words">${opts.map(o=>`<button class="tile wordbtn wd" data-id="${o.id}">${spoken(o)}</button>`).join('')}</div>`;
  talk(G.t.noArt?'Welches Wort passt?':'Lies genau. Welches Wort passt zum Bild?','look');
  $('#stage').querySelectorAll('.wordbtn').forEach(b=>b.onclick=()=>{
    if(G.busy||b.disabled) return;
    if(b.dataset.id===c.id){ b.classList.add('ok'); right(); }
    else { b.classList.add('no'); b.disabled=true; wrong(b); }
  });
}
function qArtikel(){
  const c=G.cur;
  $('#stage').innerHTML = `
    <div class="picbig pop">${pic(c)}</div>
    <div class="sentence wd"><span class="blank" id="blank">?</span><span>${c.w}</span></div>
    <div class="arts">${['der','die','das'].map(a=>`<button class="tile art wd" data-a="${a}">${a}</button>`).join('')}</div>`;
  talk('Der, die oder das? Was klingt richtig?','happy');
  $('#stage').querySelectorAll('.art').forEach(b=>b.onclick=()=>{
    if(G.busy||b.disabled) return;
    if(b.dataset.a===c.a){
      b.classList.add('ok'); const bl=$('#blank'); bl.textContent=c.a; bl.classList.add('filled'); bl.style.color=artColor(c.a); right();
    } else { b.classList.add('no'); b.disabled=true; wrong(b); }
  });
}
function qBuchstaben(){
  const c=G.cur, letters=Array.from(c.w);
  const isL = ch => /\p{L}/u.test(ch);
  let pos=0; while(pos<letters.length && !isL(letters[pos])) pos++;
  const tiles = shuffle(letters.filter(isL));
  $('#stage').innerHTML = `
    <div style="display:flex;align-items:center;gap:16px">
      <div class="picbig pop" style="width:min(42vw,150px)">${pic(c)}</div>
      ${speakBtn('small')}
    </div>
    <div class="slots wd">${letters.map((ch,i)=>`<span class="slot${isL(ch)?'':' full'}" data-i="${i}">${isL(ch)?'':ch}</span>`).join('')}</div>
    <div class="tiles wd">${tiles.map(ch=>`<button class="tile letter">${ch}</button>`).join('')}</div>`;
  talk('Hör zu und leg das Wort. Welcher Buchstabe kommt zuerst?','happy');
  const play=()=>say(c.w); $('#replay').onclick=play; setTimeout(play,300);
  const mark=()=>app.querySelectorAll('.slot').forEach((s,i)=>s.classList.toggle('on',i===pos));
  mark();
  $('#stage').querySelectorAll('.letter').forEach(b=>b.onclick=()=>{
    if(G.busy||b.classList.contains('used')) return;
    const want=letters[pos];
    if(b.textContent.toLowerCase()===want.toLowerCase()){
      b.classList.add('used'); sfx.flip();
      const s=app.querySelector(`.slot[data-i="${pos}"]`); s.textContent=want; s.classList.add('full','pop');
      pos++; while(pos<letters.length && !isL(letters[pos])) pos++;
      mark();
      if(pos>=letters.length) right();
    } else wrong(b);
  });
}

function memory(){
  const words = shuffle(G.t.words).slice(0,6);
  const cards = shuffle(words.flatMap(w=>[{w,k:'p'},{w,k:'t'}]));
  G.total=words.length; G.done=0; bar();
  $('#stage').innerHTML = `
    <div class="task">Finde die Paare!</div>
    <div class="mem">${cards.map((c,i)=>`<button class="tile card" data-i="${i}" aria-label="Karte ${i+1}"><img class="back" src="${IMG.stern}" alt=""><span class="face wd">${c.k==='p'?pic(c.w):spoken(c.w)}</span></button>`).join('')}</div>`;
  talk('Dreh zwei Karten um. Passen Bild und Wort zusammen?','look');
  let open=[], lock=false;
  const els=[...$('#stage').querySelectorAll('.card')];
  els.forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i, c=cards[i];
    if(lock||el.classList.contains('open')||el.classList.contains('done')) return;
    el.classList.add('open'); sfx.flip();
    if(c.k==='t') say(spoken(c.w));
    open.push(i);
    if(open.length<2) return;
    const [a,b]=open; open=[];
    if(cards[a].w===cards[b].w){
      [a,b].forEach(j=>{els[j].classList.remove('open');els[j].classList.add('done','pop');els[j].disabled=true});
      G.done++; bar(); sfx.good(); talk(rnd(PRAISE),'cheer');
      setTimeout(()=>say(spoken(cards[a].w)),300);
      if(G.done===G.total) setTimeout(()=>G&&finish(),1600);
    } else {
      lock=true; G.mistakes++;
      setTimeout(()=>{ els[a].classList.remove('open'); els[b].classList.remove('open'); lock=false; talk('Merk dir, wo die Karten liegen!','think'); },1100);
    }
  });
}

function finish(){
  const t=G.t, gid=G.gid;
  let stars;
  if(gid==='memory') stars = G.mistakes<=4?3:G.mistakes<=8?2:1;
  else { const base=G.total-G.retried.size; stars = G.mistakes===0?3 : G.mistakes<=Math.ceil(base/4)?2:1; }
  const prev=starsOf(t.id,gid);
  progress[t.id]=progress[t.id]||{}; progress[t.id][gid]=Math.max(prev,stars); store.set('progress',progress);
  const msg = stars===3?'Wow! Alles richtig. Du bist ein Wörter-Profi!' : stars===2?'Super gemacht! Noch einmal, dann klappt alles.' : 'Gut geübt! Üben macht dich stark.';
  G=null;
  app.innerHTML = `
    <div class="result">
      ${stars===3?`<img class="lisi hop" src="${IMG.medaille}" alt="Medaille" style="width:110px">`:''}
      ${lisi('cheer')}
      <h2>Geschafft!</h2>
      <div class="bigstars">${[1,2,3].map(i=>star(i<=stars,`class="pop${i<=stars?'':' leer'}" style="animation-delay:${i*.18}s"`)).join('')}</div>
      <div class="bubble">${msg}${stars>prev&&prev>0?' Neuer Rekord!':''}</div>
      <div class="actions">
        <button class="knopf gruen" id="again">Nochmal spielen</button>
        <button class="knopf" id="toTopic"><img class="finger links" src="${IMG.finger}" alt=""> ${t.name}</button>
      </div>
    </div>`;
  app.querySelector('.result .lisi:not([alt="Medaille"])').classList.add('hop');
  sfx.win(); say(stars===3?'Wow! Alles richtig!':'Super gemacht!');
  confetti();
  $('#again').onclick=()=>startGame(t,gid);
  $('#toTopic').onclick=()=>topicView(t);
}

/* ---------- Konfetti in Regenbogenfarben ---------- */
let confettiRun=0;
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const run=++confettiRun;
  const cv=$('#confetti'), ctx=cv.getContext('2d'); cv.hidden=false;
  const W=cv.width=innerWidth*devicePixelRatio, H=cv.height=innerHeight*devicePixelRatio;
  const cols=['#ef6f6c','#f7a541','#f2c14e','#4fb984','#4ea8de','#9b7fd4'];
  const P=Array.from({length:140},()=>({x:Math.random()*W,y:-Math.random()*H*.5,r:(4+Math.random()*6)*devicePixelRatio,
    vx:(Math.random()-.5)*3,vy:(2+Math.random()*4)*devicePixelRatio,a:Math.random()*6,va:(Math.random()-.5)*.3,c:rnd(cols)}));
  let f=0;
  (function loop(){
    if(run!==confettiRun) return;
    ctx.clearRect(0,0,W,H);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();});
    if(++f<200) requestAnimationFrame(loop); else { ctx.clearRect(0,0,W,H); cv.hidden=true; }
  })();
}

home();
</script>
