<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lisis Wörterwelt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" href="{{marke/favicon.png}}">
<style>
/* Lisi-Hausstil wie in Lisis Märchenzeit: Papier mit bunten Punkten, Regenbogenstreifen, weiße Karten mit farbigem Rand,
   Fredoka für Überschriften, Andika zum Lesen, gemalte Lisi-Symbole statt Emojis in der Bedienung. Bewusst nur helles Design. */
@font-face{font-family:Andika;font-weight:400;font-display:swap;src:url({{schriften/andika-latin-400-normal.woff2}}) format("woff2")}
@font-face{font-family:Andika;font-weight:700;font-display:swap;src:url({{schriften/andika-latin-700-normal.woff2}}) format("woff2")}
@font-face{font-family:Fredoka;font-weight:600;font-display:swap;src:url({{schriften/fredoka-latin-600-normal.woff2}}) format("woff2")}
@font-face{font-family:Fredoka;font-weight:700;font-display:swap;src:url({{schriften/fredoka-latin-700-normal.woff2}}) format("woff2")}
:root{
  --papier:#fff8ec; --weiss:#ffffff; --tinte:#2f2a44; --sanft:#6b6480; --linie:#e6e0f0;
  --rot:#ef6f6c; --orange:#f7a541; --gelb:#f2c14e; --gruen:#4fb984; --blau:#4ea8de; --lila:#9b7fd4;
  --marke:#f3bb1c; --marke-dunkel:#d99a00; --creme:#fff4dc;
  --gut:#e3f6ea; --falsch:#fde8e8;
  --der:#2f7fb3; --die:#d9504c; --das:#33946a;
  --blau-schatten:#2f7fb3; --gruen-schatten:#33946a; --gelb-schatten:#c99a10;
  --f-titel:Fredoka,"Trebuchet MS",system-ui,sans-serif;
  --f-text:Andika,"Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--tinte);font-family:var(--f-text);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden;
  background-color:var(--papier);
  background-image:radial-gradient(circle at 12% 18%,#ffe3c2 0 6px,transparent 7px),radial-gradient(circle at 82% 8%,#d9f0ff 0 8px,transparent 9px),
    radial-gradient(circle at 70% 70%,#e4f6e9 0 7px,transparent 8px),radial-gradient(circle at 30% 85%,#f1e6ff 0 6px,transparent 7px);
  background-size:260px 260px}
body.caps .wd{text-transform:uppercase;letter-spacing:.04em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--blau);outline-offset:3px}
img{max-width:100%}
.regenbogen{height:8px;background:linear-gradient(90deg,var(--rot),var(--orange),var(--gelb),var(--gruen),var(--blau),var(--lila))}
#app{max-width:820px;margin:0 auto;min-height:calc(100% - 8px);display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 18px}
h1,h2,h3{font-family:var(--f-titel);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}

/* Bausteine */
.tile{background:var(--weiss);border:3px solid var(--linie);border-radius:22px;box-shadow:0 5px 0 rgba(47,42,68,.08);
  transition:transform .1s,box-shadow .1s,border-color .15s,background .15s}
.tile:hover:not(:disabled){transform:translateY(-2px)}
.tile:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(47,42,68,.08)}
.tile:disabled{cursor:default}
.knopf{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:600 21px var(--f-titel);color:#fff;
  background:var(--blau);border:0;border-radius:999px;padding:11px 26px;box-shadow:0 5px 0 var(--blau-schatten)}
.knopf:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blau-schatten)}
.knopf.gruen{background:var(--gruen);box-shadow:0 5px 0 var(--gruen-schatten)}
.knopf.gruen:active{box-shadow:0 2px 0 var(--gruen-schatten)}
.pille{display:inline-flex;align-items:center;gap:8px;font:600 17px var(--f-titel);color:var(--sanft);background:var(--weiss);
  border:0;border-radius:999px;padding:7px 15px;box-shadow:0 3px 0 rgba(47,42,68,.08);white-space:nowrap}
.pille img{height:1.35em;width:auto}
.finger{height:1.05em;width:auto;vertical-align:middle}
.finger.links{transform:scaleX(-1)}
.symbol{height:1.4em;width:auto;vertical-align:middle}

/* Kopf */
.kopf{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.marke{display:flex;align-items:center;gap:10px;font:600 20px var(--f-titel);color:var(--tinte);background:var(--weiss);
  border:0;border-radius:999px;padding:4px 18px 4px 4px;box-shadow:0 3px 0 rgba(47,42,68,.08)}
.marke img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--marke)}
.marke b{color:var(--marke-dunkel);font-weight:700}
.schalter{display:flex;gap:8px}
.pille[aria-pressed="false"]{opacity:.55}
.pille svg{width:20px;height:20px}
.sternzahl{font-variant-numeric:tabular-nums;color:var(--tinte)}

.hero{display:flex;align-items:flex-end;gap:10px;padding-top:12px}
.hero .lisi{width:128px;flex:none}
.bubble{position:relative;background:var(--weiss);border:3px solid var(--linie);border-radius:22px;padding:12px 16px;min-width:0;margin-bottom:22px;flex:1}
.bubble::after{content:"";position:absolute;left:-12px;bottom:20px;width:18px;height:18px;background:var(--weiss);
  border-left:3px solid var(--linie);border-bottom:3px solid var(--linie);transform:rotate(45deg)}
.bubble b{font-family:var(--f-titel);font-weight:600;font-size:1.3rem;display:block;line-height:1.15;margin-bottom:2px}
.titel{font-size:clamp(34px,7vw,52px);font-weight:700;letter-spacing:.5px;text-align:center;margin:18px 0 4px}
.titel span:nth-child(6n+1){color:var(--rot)}.titel span:nth-child(6n+2){color:var(--orange)}.titel span:nth-child(6n+3){color:var(--gruen)}
.titel span:nth-child(6n+4){color:var(--blau)}.titel span:nth-child(6n+5){color:var(--lila)}.titel span:nth-child(6n+6){color:#e0a800}
.unter{text-align:center;color:var(--sanft);margin:0 0 6px}
.etikett{font:600 15px var(--f-titel);color:#fff;background:var(--f,var(--orange));border-radius:999px;padding:3px 14px;align-self:flex-start;margin:18px 0 10px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.topic{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 10px 12px;text-align:center;border-color:var(--f);border-width:4px}
.topic .big{font-size:3rem;line-height:1.15}
.topic h3{font-size:1.25rem}
.meter{width:80%;height:10px;border-radius:99px;background:var(--linie);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--marke);border-radius:99px}
.topic small{color:var(--sanft);font-variant-numeric:tabular-nums}
.fuss{margin-top:auto;padding-top:26px;text-align:center;font-size:14px;color:var(--sanft)}

/* Themenseite */
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h2{font-size:1.9rem;flex:1;min-width:0;color:var(--f,var(--tinte))}
.games{display:grid;gap:12px}
.game{display:flex;align-items:center;gap:14px;padding:12px 16px;text-align:left;width:100%;border-color:var(--f);border-width:4px}
.game .gi{width:58px;height:58px;display:grid;place-items:center;background:var(--creme);border-radius:18px;flex:none}
.game .gi img{max-width:46px;max-height:46px}
.game .gt{flex:1;min-width:0}
.game h3{font-size:1.25rem}
.game p{margin:0;color:var(--sanft);font-size:.95rem}
.stars{display:flex;gap:2px;flex:none}
.stars img{width:24px;height:24px}
img.leer{filter:grayscale(1);opacity:.3}

/* Spiel */
.play{display:flex;flex-direction:column;flex:1;min-height:0}
.topbar{display:flex;align-items:center;gap:12px}
.zu{width:46px;height:46px;border-radius:50%;padding:0;display:grid;place-items:center;font:700 20px var(--f-titel);color:var(--sanft);flex:none}
.progress{flex:1;height:20px;background:var(--weiss);border:3px solid var(--linie);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gruen),#7fd3a6);border-radius:99px;transition:width .35s ease}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:18px}
.task{font:600 1.4rem var(--f-titel);text-align:center;color:var(--sanft)}
.speak{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;border:0;background:var(--blau);box-shadow:0 6px 0 var(--blau-schatten)}
.speak svg{width:50px;height:50px}
.speak:active{transform:translateY(4px);box-shadow:0 2px 0 var(--blau-schatten)}
.speak.small{width:60px;height:60px;box-shadow:0 4px 0 var(--blau-schatten)}
.speak.small svg{width:32px;height:32px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:min(100%,420px)}
.choice{aspect-ratio:1;display:grid;place-items:center;padding:6px;max-width:100%}
.ok{background:var(--gut)!important;border-color:var(--gruen)!important}
.no{background:var(--falsch)!important;border-color:var(--rot)!important;opacity:.75}
.emo{font-size:clamp(3.4rem,15vw,5rem);line-height:1}
.picbig{width:min(62vw,210px);aspect-ratio:1;display:grid;place-items:center;background:var(--weiss);border:4px solid var(--f,var(--marke));border-radius:28px;box-shadow:0 6px 0 rgba(47,42,68,.07)}
.picbig .emo{font-size:clamp(5rem,26vw,8rem)}
.swatch{display:block;width:70%;aspect-ratio:1;border-radius:50%;background:var(--sw);border:3px solid var(--linie);box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.num{display:flex;flex-direction:column;align-items:center;gap:4px}
.num b{font-family:var(--f-titel);font-weight:700;font-size:clamp(3.2rem,14vw,5rem);line-height:.9;color:var(--blau)}
.num i{font-style:normal;color:var(--orange);font-size:.9rem;letter-spacing:2px;max-width:7.5em;text-align:center;line-height:1.1}
.words{display:grid;gap:12px;width:min(100%,420px)}
.wordbtn{padding:14px 12px;font-size:1.6rem;font-weight:700}
.sentence{font-size:2.1rem;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.blank{display:inline-block;min-width:2.8em;border-bottom:4px dashed var(--sanft);text-align:center;color:var(--sanft)}
.blank.filled{border-bottom-style:solid}
.arts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(100%,420px)}
.art{padding:16px 0;font-size:1.7rem;font-weight:700;border-width:4px}
.art[data-a="der"]{color:var(--der);border-color:#cfe6f6}.art[data-a="die"]{color:var(--die);border-color:#fbd3d2}.art[data-a="das"]{color:var(--das);border-color:#cdeedb}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.slot{width:42px;height:54px;border-bottom:5px solid var(--linie);display:grid;place-items:center;font-size:2rem;font-weight:700}
.slot.on{border-color:var(--marke)}
.slot.full{border-color:var(--gruen)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:440px}
.letter{width:56px;height:62px;font-size:1.9rem;font-weight:700;padding:0}
.letter.used{visibility:hidden}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,460px)}
@media (min-width:560px){.mem{grid-template-columns:repeat(4,1fr)}}
.card{aspect-ratio:1;padding:4px;display:grid;place-items:center;overflow:hidden}
.card .face{display:none;font-size:1.1rem;font-weight:700;text-align:center;line-height:1.15;overflow-wrap:anywhere}
.card .face .emo{font-size:clamp(2.4rem,11vw,3.4rem)}
.card .face .swatch{width:62%;margin:auto}
.card .face .num b{font-size:2.6rem}.card .face .num i{font-size:.6rem}
.card .back{width:58%;opacity:.9}
.card:not(.open):not(.done){background:var(--creme);border-color:#f6dd9a}
.card.open .face,.card.done .face{display:block}
.card.open .back,.card.done .back{display:none}
.card.done{background:var(--gut);border-color:var(--gruen)}

.say{display:flex;align-items:flex-end;gap:10px;min-height:96px}
.say .lisi{width:92px;flex:none}
.say .bubble{margin-bottom:18px}
.shake{animation:shake .4s ease}
.pop{animation:pop .35s ease both}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-16px) rotate(-4deg)}65%{transform:translateY(-6px) rotate(3deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.7);opacity:.3}100%{transform:scale(1);opacity:1}}

/* Ergebnis */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding-block:20px}
.result .lisi{width:170px}
.result h2{font-size:2.6rem;font-weight:700;color:var(--gruen-schatten)}
.bigstars{display:flex;gap:8px}
.bigstars img{width:64px;height:64px}
.result .bubble{margin:0;flex:none}
.result .bubble::after{display:none}
.actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:6px}

/* Wörterliste */
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--sanft);font-size:.95rem;margin:10px 4px 12px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;background:var(--c);vertical-align:-1px}
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:8px}
.wcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 10px;border-top:7px solid var(--c,var(--linie))}
.wcard .emo{font-size:3rem}
.wcard .swatch{width:58px}
.wcard .num b{font-size:2.6rem}
.wcard .wd{font-size:1.2rem;font-weight:700;text-align:center;overflow-wrap:anywhere}
.wcard .wd em{font-style:normal;color:var(--c)}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
@media (max-width:420px){.marke{font-size:17px}.marke img{width:36px;height:36px}.pille{font-size:15px;padding:6px 12px}.hero .lisi{width:104px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---- Lisi lebt: schweben, auftauchen, hüpfen, Kopf schütteln, reden ---- */
.lisi-box{display:inline-block;flex:none;transform-origin:50% 100%;animation:schweben 3.4s ease-in-out infinite}
.lisi-box .lisi{display:block;width:100%;height:auto;transform-origin:50% 90%;cursor:pointer;user-select:none;-webkit-user-drag:none}
.hero .lisi-box{width:128px}.say .lisi-box{width:92px}.result .lisi-box{width:170px}
@media (max-width:420px){.hero .lisi-box{width:104px}}
.lisi.neu{animation:auftauchen .45s cubic-bezier(.3,1.6,.5,1)}
.lisi.hop{animation:hopsen .7s cubic-bezier(.3,1.4,.5,1)}
.lisi.nein{animation:kopfschuetteln .6s ease}
.lisi.reden{animation:reden .5s ease}
.lisi.wackeln{animation:wackeln .8s ease}
.lisi.rein{animation:reinspringen .8s cubic-bezier(.3,1.5,.5,1) both}
.lisi.dauerjubel{animation:dauerjubel 1s ease-in-out infinite}
@keyframes schweben{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
@keyframes auftauchen{0%{transform:scale(.75) rotate(-6deg);opacity:.4}100%{transform:scale(1);opacity:1}}
@keyframes hopsen{0%{transform:scale(1,1)}15%{transform:scale(1.12,.86)}45%{transform:translateY(-30px) scale(.94,1.08) rotate(-6deg)}70%{transform:translateY(0) scale(1.08,.92)}85%{transform:scale(.97,1.03)}100%{transform:scale(1)}}
@keyframes kopfschuetteln{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@keyframes reden{0%,100%{transform:scale(1)}30%{transform:scale(1.04,.97)}60%{transform:scale(.98,1.03)}}
@keyframes wackeln{0%,100%{transform:rotate(0)}25%{transform:rotate(7deg)}50%{transform:rotate(-5deg) translateY(-6px)}75%{transform:rotate(3deg)}}
@keyframes reinspringen{0%{transform:translateY(120%) scale(.6);opacity:0}60%{transform:translateY(-12%) scale(1.06);opacity:1}100%{transform:translateY(0) scale(1)}}
@keyframes dauerjubel{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-18px) rotate(3deg)}}
.bubble.neu{animation:pop .3s ease}

/* ---- Sterne-Pillen ---- */
.punkte{display:inline-flex;align-items:center;gap:4px;font:700 1rem var(--f-titel);color:var(--tinte);background:var(--creme);
  border-radius:999px;padding:4px 12px 4px 6px;flex:none;font-variant-numeric:tabular-nums}
.punkte img{width:22px;height:22px}
.punkte small{color:var(--sanft);font-weight:600}
.punkte.leer img{filter:grayscale(1);opacity:.35}
.stand{font:600 1.05rem var(--f-titel);color:var(--sanft);font-variant-numeric:tabular-nums;min-width:3.4em;text-align:right}

/* ---- Thermometer ---- */
.thermo{display:flex;flex-direction:column;align-items:center;gap:2px}
.thermo svg{height:clamp(80px,24vw,120px);width:auto}
.thermo b{font:700 1.1rem var(--f-titel);color:var(--sanft)}
.picbig .thermo svg{height:clamp(120px,36vw,160px)}
.card .face .thermo svg{height:46px}.card .face .thermo b{font-size:.8rem}
.wcard .thermo svg{height:70px}
.mem.zehn{grid-template-columns:repeat(4,1fr)}
@media (min-width:600px){.mem.zehn{grid-template-columns:repeat(5,1fr);width:min(100%,600px)}}
.mem.zehn .card .face{font-size:.95rem}

/* ---- Sieger- und Trostsequenz ---- */
.fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.fx > *{position:absolute;line-height:1}
.fx .e{font-size:clamp(2.2rem,8vw,3.6rem)}
.result{position:relative;z-index:41}
.result .stufe{animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.result .titel{margin:0}
.zaehler{display:flex;align-items:center;gap:10px;font:700 2.4rem var(--f-titel);font-variant-numeric:tabular-nums}
.zaehler img{width:56px;height:56px}
.zaehler small{font-size:1.3rem;color:var(--sanft)}
.buehne{position:relative;display:grid;place-items:center}
.buehne .medaille{position:absolute;width:96px;top:-34px;right:-56px;animation:baumeln 2.4s ease-in-out infinite;transform-origin:50% 0}
@keyframes baumeln{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.trost .buehne .herz{position:absolute;width:62px;top:-8px;right:-40px;animation:pochen 1.2s ease-in-out infinite}
@keyframes pochen{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.uebenliste{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;font-weight:700;font-size:1.05rem}
.chip .emo{font-size:1.8rem}.chip .swatch{width:30px}.chip .num b{font-size:1.6rem}.chip .num i{display:none}
.chip .thermo svg{height:34px}.chip .thermo b{display:none}
.hinweis{color:var(--sanft);font:600 1.05rem var(--f-titel);margin:0}
/* Bewegungen der Siegersequenz */
.fx .laufen{left:0;animation:laufen var(--d,6s) linear var(--v,0s) both}
.fx .laufen > span{display:block;animation:huepfen .5s ease-in-out infinite alternate}
@keyframes laufen{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
@keyframes huepfen{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-22px) rotate(6deg)}}
.fx .regnen{top:0;animation:regnen var(--d,3.5s) ease-in var(--v,0s) both}
@keyframes regnen{from{transform:translateY(-15vh) rotate(0)}to{transform:translateY(112vh) rotate(var(--r,200deg))}}
.fx .wachsen{bottom:-6px;transform-origin:50% 100%;animation:wachsen 1.2s cubic-bezier(.3,1.5,.5,1) var(--v,0s) both}
.fx .wachsen.gross{font-size:clamp(3rem,12vw,5.2rem)}
@keyframes wachsen{from{transform:scale(0) translateY(40%)}to{transform:scale(1) translateY(0)}}
.fx .platzen{left:50%;top:42%;animation:platzen var(--d,1.6s) cubic-bezier(.1,.8,.3,1) var(--v,0s) both}

/* ---------- Ton ---------- */
let voice=null;
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices();
    voice = vs.find(v=>/^de[-_]DE/i.test(v.lang) && /Anna|Petra|Helena|Katja|Marlene|Vicki|Google/i.test(v.name))
         || vs.find(v=>/^de/i.test(v.lang)) || null;
  }catch(e){}
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(text);
      u.lang='de-DE'; if(voice) u.voice=voice; u.rate=.82; u.pitch=1.15;
      speechSynthesis.speak(u);
    },60);
  }catch(e){}
}
let timers=[];
const later = (fn,ms) => { const id=setTimeout(fn,ms); timers.push(id); return id; };
const hush = () => { try{ window.speechSynthesis && speechSynthesis.cancel(); }catch(e){}
  timers.forEach(clearTimeout); timers=[];

  document.querySelectorAll('.fx').forEach(f=>f.remove()); };
const spoken = it => it.a ? it.a+' '+it.w : it.w;

let actx=null;
function tone(freqs, dur=.13, type='sine', gap=.1, vol=.18){
  if(!settings.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t0=actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=f;
      const s=t0+i*gap;
      g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(vol,s+.015); g.gain.exponentialRampToValueAtTime(.001,s+dur);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s+dur+.02);
    });
  }catch(e){}
}
const sfx = {

  flip:()=>tone([520],.06,'triangle',0,.08),
  tick:i=>tone([600+i*25],.07,'triangle',0,.09),
  win:()=>tone([523,659,784,1047,784,1047,1319],.24,'triangle',.13),
  trost:()=>tone([392,440,523,659],.32,'sine',.22,.14)
};

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const pick = (arr,n,not) => shuffle(arr.filter(x=>x!==not)).slice(0,n);
const rnd = a => a[Math.floor(Math.random()*a.length)];
const MOOD = {happy:'lacht', cheer:'jubelt', think:'denkt', look:'lupe'};
const lisi = (mood='happy', cls='neu') => `<span class="lisi-box"><img class="lisi ${cls}" src="${IMG[MOOD[mood]]}" alt="Lisi" draggable="false"></span>`;
function act(img, cls){ if(!img) return; img.classList.remove('neu','hop','nein','reden','wackeln','rein'); void img.offsetWidth; img.classList.add(cls); }
const TH = {35:['#ef6f6c',.92], 25:['#f7a541',.66], 10:['#4ea8de',.4], 0:['#2f7fb3',.16]};
function thermo(v){
  const [c,l]=TH[v]||['#4ea8de',.5], h=Math.round(66*l);
  return `<span class="thermo"><svg viewBox="0 0 40 110" aria-hidden="true"><rect x="12" y="5" width="16" height="84" rx="8" fill="#fff" stroke="#c9c2d9" stroke-width="3"/>
    ${[20,36,52,68].map(y=>`<line x1="28" y1="${y}" x2="33" y2="${y}" stroke="#c9c2d9" stroke-width="2.5"/>`).join('')}
    <rect x="16.5" y="${84-h}" width="7" height="${h+6}" rx="3.5" fill="${c}"/><circle cx="20" cy="94" r="12" fill="${c}" stroke="#c9c2d9" stroke-width="3"/></svg><b>${v} °C</b></span>`;
}
function pic(it){
  if(it.c) return `<span class="swatch" style="--sw:${it.c}"></span>`;
  if(it.n) return `<span class="num"><b>${it.n}</b><i>${'●'.repeat(it.n)}</i></span>`;
  if(it.th!==undefined) return thermo(it.th);
  return `<span class="emo">${it.e}</span>`;
}

/* ---------- Spiel ---------- */
let G=null;
/* 20 Aufgaben: zuerst die Übungswörter, dann gemischt; nie zweimal dasselbe Wort direkt hintereinander. */
function baueRunde(pool, fokus){
  const out=[]; let bag=shuffle(fokus.filter(w=>pool.includes(w)));
  while(out.length<RUNDE){
    if(!bag.length) bag=shuffle(pool);
    let i=bag.findIndex(w=>w!==out[out.length-1]); if(i<0) i=0;
    out.push(bag.splice(i,1)[0]);
  }
  return out;
}
function startGame(t,gid,fokus=[]){
  hush();
  G={t, gid, correct:0, done:0, total:RUNDE, queue:[], missed:new Map(), cur:null, wrongNow:false, busy:false, fokus};
  app.innerHTML = `
    <div class="play">
      <div class="topbar">
        <button class="tile zu" id="quit" aria-label="Spiel beenden">✕</button>
        <div class="progress" role="progressbar" aria-label="Fortschritt"><i id="bar"></i></div>
        <span class="stand" id="stand">0/${RUNDE}</span>
      </div>
      <div class="stage" id="stage"></div>
      <div class="say">${lisi('happy')}<div class="bubble" id="talk"></div></div>
    </div>`;
  $('#quit').onclick=()=>{ G=null; topicView(t); };
  if(gid==='memory') return memory();
  let pool = gid==='artikel' ? nouns(t) : t.words;
  if(gid==='buchstaben'){ const short=pool.filter(w=>w.w.length<=7); if(short.length>=6) pool=short; }
  G.queue = baueRunde(pool, fokus);
  next();
}
function talk(text, mood){
  const b=$('#talk'); if(!b) return;
  b.textContent=text; b.classList.remove('neu'); void b.offsetWidth; b.classList.add('neu');
  const img=app.querySelector('.say .lisi');
  if(mood && img){
    const src=IMG[MOOD[mood]];
    if(img.getAttribute('src')!==src) img.src=src;
    act(img, mood==='cheer'?'hop':mood==='think'?'nein':'reden');
  } else act(img,'reden');
}
function bar(){
  const b=$('#bar'); if(b) b.style.width=(G.done/G.total*100)+'%';
  const s=$('#stand'); if(s) s.textContent=`${G.done}/${G.total}`;
}
function next(){
  if(!G) return;
  bar();
  if(!G.queue.length) return finish();
  G.cur=G.queue.shift(); G.wrongNow=false; G.busy=false;
  ({hoeren:qHoeren, lesen:qLesen, artikel:qArtikel, buchstaben:qBuchstaben})[G.gid]();
}
function wrong(el){
  sfx.bad();
  if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  if(!G.wrongNow){ G.wrongNow=true; G.missed.set(G.cur.id, G.cur); }
  talk(rnd(OOPS),'think');
}
function right(){
  G.busy=true; sfx.good(); if(!G.wrongNow) G.correct++; G.done++; bar();
  talk(G.wrongNow?'Jetzt hast du es! Weiter geht es.':rnd(PRAISE),'cheer');
  later(()=>G&&say(spoken(G.cur)), 250);
  later(()=>{ if(G) next(); }, 1500);
}
const speakBtn = (cls='') => `<button class="speak ${cls}" id="replay" aria-label="Nochmal hören">${LAUT}</button>`;

function qHoeren(){
  const c=G.cur, opts=shuffle([c,...pick(G.t.words,3,c)]);
  $('#stage').innerHTML = `
    ${speakBtn()}

  $('#replay').onclick=play; later(play,300);
  $('#stage').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
    if(G.busy||b.disabled) return;
    if(b.dataset.id===c.id){ b.classList.add('ok'); right(); }
    else { b.classList.add('no'); b.disabled=true; wrong(b); later(play,500); }
  });
}
function qLesen(){
  const c=G.cur, opts=shuffle([c,...pick(G.t.words,2,c)]);
  $('#stage').innerHTML = `
    <div class="picbig pop">${pic(c)}</div>
    <div class="task">Was ist das?</div>
    <div class="words">${opts.map(o=>`<button class="tile wordbtn wd" data-id="${o.id}">${spoken(o)}</button>`).join('')}</div>`;
  talk('Lies genau. Welches Wort passt zum Bild?','look');
  $('#stage').querySelectorAll('.wordbtn').forEach(b=>b.onclick=()=>{
    if(G.busy||b.disabled) return;
    if(b.dataset.id===c.id){ b.classList.add('ok'); right(); }
    else { b.classList.add('no'); b.disabled=true; wrong(b); }
  });
}
function qArtikel(){
  const c=G.cur;
  $('#stage').innerHTML = `
    <div class="picbig pop">${pic(c)}</div>
    <div class="sentence wd"><span class="blank" id="blank">?</span><span>${c.w}</span></div>
    <div class="arts">${['der','die','das'].map(a=>`<button class="tile art wd" data-a="${a}">${a}</button>`).join('')}</div>`;
  talk('Der, die oder das? Was klingt richtig?','happy');
  $('#stage').querySelectorAll('.art').forEach(b=>b.onclick=()=>{
    if(G.busy||b.disabled) return;
    if(b.dataset.a===c.a){
      b.classList.add('ok'); const bl=$('#blank'); bl.textContent=c.a; bl.classList.add('filled'); bl.style.color=artColor(c.a); right();
    } else { b.classList.add('no'); b.disabled=true; wrong(b); }
  });
}
function qBuchstaben(){
  const c=G.cur, letters=Array.from(c.w);
  const isL = ch => /\p{L}/u.test(ch);
  let pos=0; while(pos<letters.length && !isL(letters[pos])) pos++;
  const tiles = shuffle(letters.filter(isL));
  $('#stage').innerHTML = `
    <div style="display:flex;align-items:center;gap:16px">
      <div class="picbig pop" style="width:min(42vw,150px)">${pic(c)}</div>
      ${speakBtn('small')}
    </div>
    <div class="slots wd">${letters.map((ch,i)=>`<span class="slot${isL(ch)?'':' full'}" data-i="${i}">${isL(ch)?'':ch}</span>`).join('')}</div>
    <div class="tiles wd">${tiles.map(ch=>`<button class="tile letter">${ch}</button>`).join('')}</div>`;
  talk('Hör zu und leg das Wort. Welcher Buchstabe kommt zuerst?','happy');
  const play=()=>say(c.w); $('#replay').onclick=play; later(play,300);
  const mark=()=>app.querySelectorAll('.slot').forEach((s,i)=>s.classList.toggle('on',i===pos));
  mark();
  $('#stage').querySelectorAll('.letter').forEach(b=>b.onclick=()=>{
    if(G.busy||b.classList.contains('used')) return;
    const want=letters[pos];
    if(b.textContent.toLowerCase()===want.toLowerCase()){
      b.classList.add('used'); sfx.flip();
      const s=app.querySelector(`.slot[data-i="${pos}"]`); s.textContent=want; s.classList.add('full','pop');
      pos++; while(pos<letters.length && !isL(letters[pos])) pos++;
      mark();
      if(pos>=letters.length) right();
    } else wrong(b);
  });
}

/* Memory: 20 Aufgaben = 20 Paare, verteilt auf 4 Kartenrunden mit je 5 Paaren (10 Karten).
   Pro Kartenrunde gibt es 5 Sterne; jeder Fehlversuch nach den ersten zwei kostet einen Stern. */
function memory(){
  const words=G.t.words, used=new Set(), boards=[];
  for(let b=0;b<4;b++){
    let cand=shuffle(words.filter(w=>!used.has(w.id)));
    if(cand.length<5) cand=cand.concat(shuffle(words.filter(w=>!cand.includes(w))));
    const board=cand.slice(0,5); board.forEach(w=>used.add(w.id)); boards.push(board);
  }
  G.boards=boards; G.found=0; G.correct=0; G.total=RUNDE; G.done=0;
  memoryBoard(0);
}
function memoryBoard(nr){
  if(!G) return;
  const words=G.boards[nr], cards=shuffle(words.flatMap(w=>[{w,k:'p'},{w,k:'t'}]));
  let found=0, flops=0, open=[], lock=false;
  bar(); $('#stand').textContent=`${G.found}/${RUNDE} Paare`;
  $('#stage').innerHTML = `
    <div class="task">Kartenrunde ${nr+1} von 4: Finde die Paare!</div>
    <div class="mem fuenf">${cards.map((c,i)=>`<button class="tile card pop" data-i="${i}" aria-label="Karte ${i+1}" style="animation-delay:${i*.04}s"><img class="back" src="${IMG.stern}" alt=""><span class="face wd">${c.k==='p'?pic(c.w):spoken(c.w)}</span></button>`).join('')}</div>`;
  talk(nr===0?'Dreh zwei Karten um. Passen Bild und Wort zusammen?':'Neue Karten! Du schaffst das.','look');
  const els=[...$('#stage').querySelectorAll('.card')];
  els.forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i, c=cards[i];
    if(!G||lock||el.classList.contains('open')||el.classList.contains('done')) return;
    el.classList.add('open'); sfx.flip();
    if(c.k==='t') say(spoken(c.w));
    open.push(i);
    if(open.length<2) return;
    const [a,b]=open; open=[];
    if(cards[a].w===cards[b].w){
      [a,b].forEach(j=>{els[j].classList.remove('open','pop');void els[j].offsetWidth;els[j].classList.add('done','pop');els[j].disabled=true});
      found++; G.found++; G.done=G.found; bar(); $('#stand').textContent=`${G.found}/${RUNDE} Paare`;
      sfx.good(); talk(rnd(PRAISE),'cheer');
      later(()=>say(spoken(cards[a].w)),300);
      if(found===words.length){
        G.correct += Math.max(0, words.length-Math.max(0,flops-2));
        if(nr<3) later(()=>memoryBoard(nr+1),1500);
        else later(()=>G&&finish(),1600);
      }
    } else {
      lock=true; flops++;
      [cards[a].w,cards[b].w].forEach(w=>G.missed.set(w.id,w));
      later(()=>{ els[a].classList.remove('open'); els[b].classList.remove('open'); lock=false; talk('Merk dir, wo die Karten liegen!','think'); },1100);
    }
  });
}

function finish(){
  const t=G.t, gid=G.gid, score=G.correct;
  const missed=[...G.missed.values()];
  const prev=starsOf(t.id,gid);
  progress[t.id]=progress[t.id]||{}; progress[t.id][gid]=Math.max(prev,score); store.set('runden20',progress);
  G=null;
  (score>=SIEG_AB ? sieg : trost)(t, gid, score, prev, missed);
}

/* ---------- Siegersequenz ---------- */
function fxLayer(){ const f=document.createElement('div'); f.className='fx'; document.body.appendChild(f); return f; }
const R=(a,b)=>a+Math.random()*(b-a);
function span(cls, html, vars){ const s=document.createElement('span'); s.className=cls; s.innerHTML=html;
  Object.entries(vars||{}).forEach(([k,v])=>s.style.setProperty(k,v)); return s; }
function spielFx(f, show){
  const D=show.dinge, E=x=>`<span class="e">${x}</span>`;
  const mode=show.fx;
  if(mode==='laufen'){
    D.forEach((d,i)=>{ const s=span('laufen',`<span class="e">${d}</span>`,{'--d':(show.schnell?R(2.4,3.4):R(5,7))+'s','--v':(i*.35)+'s'}); s.style.top=R(58,84)+'vh'; f.appendChild(s); });
  }
  if(mode==='regnen'||mode==='wetter'){
    for(let i=0;i<26;i++){ const s=span('regnen',E(rnd(mode==='wetter'?['☀️','☁️','❄️','💧','💧']:D)),{'--d':R(2.6,4.2)+'s','--v':R(0,2.6)+'s','--r':R(-260,260)+'deg'}); s.style.left=R(0,94)+'vw'; f.appendChild(s); }
    if(mode==='wetter'){ f.appendChild(span('bogen','')); const s=span('wachsen gross',E('☀️'),{'--v':'1.4s'}); s.style.left='8vw'; s.style.bottom='58vh'; f.appendChild(s); }
  }
  if(mode==='wachsen'){
    const n=Math.max(12,Math.round(innerWidth/55));
    for(let i=0;i<n;i++){ const s=span('wachsen'+(i%3===0?' gross':''),E(rnd(D)),{'--v':(R(0,1.6))+'s'}); s.style.left=(i/n*100-2+R(-1,1))+'vw'; f.appendChild(s); }
  }
  if(mode==='platzen'||mode==='schule'){
    const runs = mode==='schule'?1:3;
    for(let r=0;r<runs;r++) for(let i=0;i<14;i++){
      const a=i/14*Math.PI*2+R(-.2,.2), d=R(28,46);
      const html = show.zahlen ? `<span class="e" style="font-family:var(--f-titel);font-weight:700;color:${rnd(['#ef6f6c','#f7a541','#4fb984','#4ea8de','#9b7fd4'])}">${D[i%D.length]}</span>` : E(rnd(D));
      const s=span('platzen',html,{'--dx':Math.cos(a)*d+'vmin','--dy':Math.sin(a)*d+'vmin','--v':(r*1.1+R(0,.2))+'s','--r':R(-120,120)+'deg'});
      s.style.top=(30+r*8)+'%'; f.appendChild(s);
    }
  }
  if(mode==='flattern'){
    for(let i=0;i<16;i++){ const s=span('flattern',E(rnd(D)),{'--d':R(4.5,6.5)+'s','--v':R(0,2.5)+'s','--w':R(4,12)+'vw'}); s.style.left=R(2,90)+'vw'; f.appendChild(s); }
  }
  if(mode==='klecks'){
    const cols=['#E53935','#1E6FE0','#FFD31A','#2EA44F','#FF8A1F','#8E44C9','#FF9EC4'];
    for(let i=0;i<22;i++){ const z=R(40,120); const s=span('klecks','',{'--v':R(0,2)+'s'}); Object.assign(s.style,{width:z+'px',height:z+'px',left:R(-4,92)+'vw',top:R(-4,90)+'vh',background:rnd(cols)}); f.appendChild(s); }
  }
  if(mode==='kreis'||mode==='welt'){
    const k=span('kreis',''); const n=D.length;
    D.forEach((d,i)=>k.appendChild(span('',E(d),{'--a':(i/n*360)+'deg','--rad':'min(40vw,210px)'})));
    f.appendChild(k);
    if(mode==='welt'){ const p=span('laufen',`<span class="e">✈️</span>`,{'--d':'3.6s','--v':'.4s'}); p.style.top='10vh'; f.appendChild(p); }
  }
}
function zaehle(el, bis){
  let i=0; const step=()=>{ if(!el.isConnected) return; el.textContent=i; if(i>0) sfx.tick(i); if(i<bis){ i++; later(step, 70); } };
  step();
}
function sieg(t, gid, score, prev){
  const show=SHOW[t.id];
  hush();
  app.innerHTML = `
    <div class="result sieg">
      <div class="buehne stufe">${lisi('cheer','rein')}<img class="medaille" src="${IMG.medaille}" alt=""></div>
      <h2 class="titel stufe" style="animation-delay:.5s" aria-label="${show.titel}">${bunt(show.titel)}</h2>
      ${show.fx==='schule'?`<div class="urkunde-karte"><span>Urkunde</span>für tolles Lernen in der Schule<b>${score} von ${RUNDE} Sternen</b></div>`:''}
      <div class="zaehler stufe" style="animation-delay:.9s"><img src="${IMG.stern}" alt=""><span id="zahl">0</span><small>von ${RUNDE} Sternen</small></div>
      <div class="bubble stufe" style="animation-delay:1.2s">${score===RUNDE?'Alles richtig! ':''}${show.text}${score>prev&&prev>0?' Neuer Rekord!':''}</div>
      <div class="actions stufe" style="animation-delay:1.8s">
        <button class="knopf gruen" id="again">Nochmal spielen</button>
        <button class="knopf" id="toTopic"><img class="finger links" src="${IMG.finger}" alt=""> ${t.name}</button>
      </div>
    </div>`;
  const img=app.querySelector('.result .lisi');
  later(()=>{ img.classList.remove('rein'); img.classList.add('dauerjubel'); }, 900);
  later(()=>{ img.classList.remove('dauerjubel'); }, 5200);
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) spielFx(fxLayer(), show);
  sfx.win(); later(()=>say(`${show.titel} ${score} Sterne! ${show.text}`), 500);
  later(()=>zaehle($('#zahl'), score), 1000);
  later(confetti, 1600);
  $('#again').onclick=()=>startGame(t,gid);
  $('#toTopic').onclick=()=>topicView(t);
}

/* Ruhige, tröstende Animation passend zum Thema */
function trostFx(f, tf){
  if(!tf) return;
  const E=x=>`<span class="e">${x}</span>`;
  if(tf.art==='gehen'){ const s=span('laufen',`<span class="e langsam">${tf.ding}</span>`,{'--d':(tf.d||11)+'s','--v':'.6s'}); s.style.top='80vh'; f.appendChild(s); }
  if(tf.art==='steigen'){ tf.dinge.forEach((d,i)=>{ const s=span('schweben',E(d),{'--d':R(6,8)+'s','--v':(.6+i*.9)+'s','--w':R(-6,6)+'vw'}); s.style.left=R(8,84)+'vw'; f.appendChild(s); }); }
  if(tf.art==='wandeln'){ const s=span('wachsen gross',E(tf.von),{'--v':'.8s'}); s.style.left='calc(50vw - .5em)'; f.appendChild(s);
    later(()=>{ s.innerHTML=E(tf.zu); s.classList.remove('wachsen'); void s.offsetWidth; s.classList.add('wachsen'); s.style.setProperty('--v','0s'); }, 3000); }
  if(tf.art==='regenSonne'){ for(let i=0;i<10;i++){ const s=span('regnen',E('💧'),{'--d':R(3,4.5)+'s','--v':R(0,1.8)+'s','--r':'0deg'}); s.style.left=R(4,92)+'vw'; f.appendChild(s); }
    const sun=span('wachsen gross',E('☀️'),{'--v':'2.6s'}); sun.style.left='8vw'; sun.style.bottom='62vh'; f.appendChild(sun); }
  if(tf.art==='kleckse'){ ['#FF9EC4','#4ea8de','#f2c14e','#4fb984'].forEach((c,i)=>{ const z=R(50,80); const s=span('klecks','',{'--v':(.5+i*.7)+'s'}); Object.assign(s.style,{width:z+'px',height:z+'px',left:R(4,80)+'vw',top:R(60,84)+'vh',background:c}); f.appendChild(s); }); }
}
/* ---------- Trostsequenz ---------- */
function trost(t, gid, score, prev, missed){
  const show=SHOW[t.id];
  hush();
  const liste = missed.slice(0,8);
  app.innerHTML = `
    <div class="result trost">
      <div class="buehne stufe">${lisi('think')}<img class="herz" src="${IMG.herz}" alt="" hidden></div>
      <h2 class="titel stufe" style="animation-delay:.4s" aria-label="Schön, dass du geübt hast!">${bunt('Schön geübt!')}</h2>
      <div class="zaehler stufe" style="animation-delay:.8s"><img src="${IMG.stern}" alt=""><span id="zahl">0</span><small>von ${RUNDE} Sternen</small></div>
      <div class="bubble stufe" style="animation-delay:1.1s">${show.trost} Ab ${SIEG_AB} Sternen wartet eine Überraschung auf dich!${score>prev&&prev>0?' Und du bist schon besser als beim letzten Mal!':''}</div>
      ${liste.length?`<p class="hinweis stufe" style="animation-delay:1.5s">Diese Wörter üben wir nochmal. Tipp drauf und hör zu:</p>
      <div class="uebenliste stufe" style="animation-delay:1.7s">${liste.map(it=>`<button class="tile chip wd" data-id="${it.id}">${pic(it)}${spoken(it)}</button>`).join('')}</div>`:''}
      <div class="actions stufe" style="animation-delay:2s">
        ${liste.length?`<button class="knopf gruen" id="practice">Diese Wörter üben</button>`:''}
        <button class="knopf${liste.length?'':' gruen'}" id="again">Nochmal spielen</button>
        <button class="knopf" id="toTopic" style="background:var(--lila);box-shadow:0 5px 0 #7a5fb5"><img class="finger links" src="${IMG.finger}" alt=""> ${t.name}</button>
      </div>
    </div>`;
  const img=app.querySelector('.result .lisi');
  later(()=>{ img.src=IMG.lacht; act(img,'hop'); app.querySelector('.herz').hidden=false; }, 1300);
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    const f=fxLayer();
    for(let i=0;i<5;i++){ const s=span('schweben',`<img src="${IMG.herz}" alt="">`,{'--d':R(6,8)+'s','--v':R(1,4)+'s','--w':R(-8,8)+'vw','--s':R(30,46)+'px'}); s.style.left=R(4,88)+'vw'; f.appendChild(s); }
    trostFx(f, show.trostFx);
  }
  sfx.trost(); later(()=>say(`Nicht schlimm! Du hast ${score} Sterne gesammelt. ${show.trost}`), 400);
  later(()=>zaehle($('#zahl'), score), 900);
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ const it=liste.find(w=>w.id===b.dataset.id); say(spoken(it)); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); });
  const p=$('#practice'); if(p) p.onclick=()=>startGame(t,gid,liste);
  $('#again').onclick=()=>startGame(t,gid);
  $('#toTopic').onclick=()=>topicView(t);
}

/* ---------- Konfetti in Regenbogenfarben ---------- */
let confettiRun=0;
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const run=++confettiRun;
  const cv=$('#confetti'), ctx=cv.getContext('2d'); cv.hidden=false;
  const W=cv.width=innerWidth*devicePixelRatio, H=cv.height=innerHeight*devicePixelRatio;
  const cols=['#ef6f6c','#f7a541','#f2c14e','#4fb984','#4ea8de','#9b7fd4'];
  const P=Array.from({length:140},()=>({x:Math.random()*W,y:-Math.random()*H*.5,r:(4+Math.random()*6)*devicePixelRatio,
    vx:(Math.random()-.5)*3,vy:(2+Math.random()*4)*devicePixelRatio,a:Math.random()*6,va:(Math.random()-.5)*.3,c:rnd(cols)}));
  let f=0;
  (function loop(){
    if(run!==confettiRun) return;
    ctx.clearRect(0,0,W,H);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();});
    if(++f<220) requestAnimationFrame(loop); else { ctx.clearRect(0,0,W,H); cv.hidden=true; }
  })();
}

home();
